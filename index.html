    case 'newtask':taskForm(null,el.dataset.p);break;
    case 'edittask':taskForm(T(id));break;
    case 'donetask':{const t=T(id);t.status=t.status==='done'?'todo':'done';commit(t.status==='done'?'Η εργασία ολοκληρώθηκε και βγήκε από το πρόγραμμα.':'Η εργασία άνοιξε ξανά.');break}
    case 'savetask':{const v=readTaskForm();if(!v.title){toast('Γράψε τίτλο για την εργασία.');break}
      if(!v.responsibleId){const l=S.workers.find(w=>w.role!=='voith'&&!isExt(w)&&w.specialtyId===v.specialtyId)||S.workers.find(w=>isExt(w)&&w.specialtyId===v.specialtyId);if(!l){toast('Δεν υπάρχει αρχιεργάτης, τεχνίτης ή συνεργάτης σε αυτή την ειδικότητα.');break}v.responsibleId=l.id}
      const isNew=v.isNew;delete v.isNew;
      if(isNew)S.tasks.push({...v,status:'todo'});else Object.assign(T(v.id),v);
      commit(isNew?'Η εργασία προστέθηκε στο πρόγραμμα.':'Οι αλλαγές αποθηκεύτηκαν.');break}
    case 'deltask':if(el.dataset.sure){S.tasks=S.tasks.filter(t=>t.id!==id);S.tasks.forEach(t=>{if(t.after===id)t.after=''});commit('Η εργασία διαγράφηκε.')}else{el.dataset.sure=1;el.textContent='Σίγουρα; Πάτα ξανά'}break;
    case 'newduty':dutyForm(null);break;
    case 'editduty':dutyForm(byId(S.duties,id));break;
    case 'saveduty':{const f=document.getElementById('df');const g=x=>document.getElementById(x).value;
      const v={id:f.dataset.id,title:g('d_title').trim(),workerId:g('d_worker'),projectId:g('d_proj'),freq:g('d_freq'),date:g('d_date'),days:[...f.querySelectorAll('[data-dd]:checked')].map(x=>+x.dataset.dd)};
      if(!v.title){toast('Γράψε τίτλο για το καθήκον.');break}
      if(v.freq==='days'&&!v.days.length){toast('Διάλεξε τουλάχιστον μία μέρα.');break}
      if(f.dataset.new==='1')S.duties.push(v);else Object.assign(byId(S.duties,v.id),v);commit('Το καθήκον αποθηκεύτηκε.');break}
    case 'delduty':if(el.dataset.sure){S.duties=S.duties.filter(x=>x.id!==id);commit('Το καθήκον διαγράφηκε.')}else{el.dataset.sure=1;el.textContent='Σίγουρα; Πάτα ξανά'}break;
    case 'newproj':projForm(null);break;
    case 'editproj':projForm(P(id));break;
    case 'saveproj':{const f=document.getElementById('pf');const g=x=>document.getElementById(x).value;const v={id:f.dataset.id,name:g('g_name').trim(),location:g('g_loc').trim(),budget:+g('g_budget')||0,color:g('g_color'),managers:[...f.querySelectorAll('[data-mgr]:checked')].map(x=>x.dataset.mgr)};
      if(!v.name){toast('Γράψε όνομα έργου.');break}
      el.disabled=true;
      // η περιοχή για τον καιρό: αν άλλαξε και δεν πατήθηκε «Εύρεση», τη βρίσκει τώρα
      geoField('g').then(geo=>{
        Object.assign(v,geo?{place:geo.place,lat:geo.lat,lon:geo.lon}:{place:'',lat:null,lon:null});
        if(f.dataset.new==='1')S.projects.push(v);else Object.assign(P(v.id),v);
        commit('Το έργο αποθηκεύτηκε.'+(g('g_place').trim()&&!geo?' Η περιοχή δεν βρέθηκε, ο καιρός παίρνεται από την έδρα.':''));wxRefresh()}).finally(()=>{el.disabled=false});break}
    case 'delproj':if(el.dataset.sure){S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.projectId!==id);S.duties.forEach(x=>{if(x.projectId===id)x.projectId=''});(S.appts||[]).forEach(a=>{if(a.projectId===id)a.projectId=''});commit('Το έργο και οι εργασίες του διαγράφηκαν.')}else{el.dataset.sure=1;el.textContent='Διαγράφει και τις εργασίες. Πάτα ξανά'}break;
    case 'newworker':workerForm(null);break;
    case 'newpartner':partnerForm(null);break;
    case 'editpartner':partnerForm(W(id));break;
    case 'savepartner':{const f=document.getElementById('xf');const g=x=>document.getElementById(x).value;
      const v={id:f.dataset.id,company:g('x_company').trim(),name:g('x_name').trim(),afm:g('x_afm').trim(),specialtyId:g('x_spec'),phone:g('x_phone').trim(),pay:g('x_pay'),wage:+g('x_wage')||0,role:'ext',off:g('x_off').split(/[,\s]+/).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s))};
      if(!v.company&&!v.name){toast('Γράψε επωνυμία ή όνομα.');break}if(!v.name)v.name=v.company;
      if(v.pay==='day'&&!v.wage){toast('Γράψε μεροκάματο ή διάλεξε «κατ\' αποκοπή».');break}
      if(f.dataset.new==='1')S.workers.push({...v,rates:{}});else Object.assign(W(v.id),v);commit('Ο συνεργάτης αποθηκεύτηκε.');break}
    case 'cpay':cpayForm(W(id));break;
    case 'savecpay':{const f=document.getElementById('cpf');const amount=+document.getElementById('c_amount').value||0;if(amount<=0){toast('Γράψε ποσό.');break}
      S.cpay=S.cpay||[];S.cpay.push({id:uid('c'),workerId:f.dataset.id,amount,date:document.getElementById('c_date').value||TODAY,note:document.getElementById('c_note').value.trim()});commit('Η πληρωμή των '+eur(amount)+' καταχωρίστηκε.');break}
    case 'delcpay':{const x=(S.cpay||[]).find(c=>c.id===id);S.cpay=S.cpay.filter(c=>c.id!==id);save();cpayForm(W(x.workerId));render();toast('Η πληρωμή αναιρέθηκε.');break}
    case 'editworker':workerForm(W(id));break;
    case 'rates':ratesForm(W(id));break;
    case 'saverates':{const f=document.getElementById('rf');const w=W(f.dataset.id);w.rates={};f.querySelectorAll('[data-rate]').forEach(i=>{if(i.value!=='')w.rates[i.dataset.rate]=+i.value});commit('Τα μεροκάματα ανά έργο αποθηκεύτηκαν.');break}
    case 'saveworker':{const f=document.getElementById('wf');const g=x=>document.getElementById(x).value;
      const v={id:f.dataset.id,name:g('h_name').trim(),specialtyId:g('h_spec'),role:g('h_role'),wage:+g('h_wage')||0,phone:g('h_phone').trim(),off:g('h_off').split(/[,\s]+/).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s))};
      if(!v.name){toast('Γράψε ονοματεπώνυμο.');break}
      if(SP(v.specialtyId)?.office)v.role='ypal';else if(v.role==='ypal'||v.role==='ext')v.role='voith';
      if(f.dataset.new==='1')S.workers.push({...v,rates:{}});else Object.assign(W(v.id),v);commit('Ο εργαζόμενος αποθηκεύτηκε.');break}
    case 'delworker':if(el.dataset.sure){S.workers=S.workers.filter(w=>w.id!==id);S.duties=S.duties.filter(x=>x.workerId!==id);(S.appts||[]).forEach(a=>{a.people=(a.people||[]).filter(x=>x!==id)});
      S.cpay=(S.cpay||[]).filter(x=>x.workerId!==id);S.tasks.forEach(t=>{if(t.responsibleId===id){const l=S.workers.find(w=>w.role!=='voith'&&!isExt(w)&&w.specialtyId===t.specialtyId);t.responsibleId=l?l.id:''}});commit('Ο εργαζόμενος διαγράφηκε.')}else{el.dataset.sure=1;el.textContent='Σίγουρα; Πάτα ξανά'}break;
    case 'newspec':openModal(`<h2>Νέα ειδικότητα</h2><form class="form" id="sf"><label class="full">Όνομα<input id="sp_name" placeholder="π.χ. Μονωτές ή Λογιστήριο"></label><label class="full ck"><input type="checkbox" id="sp_office"> <span>Ειδικότητα γραφείου (δεν μπαίνει σε συνεργεία έργων)</span></label><label class="full ck"><input type="checkbox" id="sp_pm"> <span>Διαχείριση έργων (ορίζεται σε έργα, μπορεί σε πολλά μαζί)</span></label></form><div class="acts"><span class="grow"></span><button class="btn" data-act="close">Άκυρο</button><button class="btn pri" data-act="savespec">Αποθήκευση</button></div>`);break;
    case 'savespec':{const n=document.getElementById('sp_name').value.trim();if(!n){toast('Γράψε όνομα ειδικότητας.');break}const pm=document.getElementById('sp_pm').checked;const office=pm||document.getElementById('sp_office').checked;
      const i=office?S.specialties.length:S.specialties.findIndex(s=>s.id==='gen');S.specialties.splice(i<0?S.specialties.length:i,0,{id:uid('s'),name:n,office,pm});commit('Η ειδικότητα προστέθηκε.');break}
    case 'pay':{const R=schedule();const r=payData(R,UI.payWeek).find(x=>x.w.id===id);S.payments[UI.payWeek+'|'+id]={amount:r.amount,days:r.days,date:TODAY};commit(W(id).name+': πληρώθηκε '+eur(r.amount)+'.');break}
    case 'unpay':delete S.payments[UI.payWeek+'|'+id];commit('Η πληρωμή αναιρέθηκε.');break;
    case 'payall':{const R=schedule();const rs=payData(R,UI.payWeek).filter(r=>!r.paid&&r.days);rs.forEach(r=>S.payments[UI.payWeek+'|'+r.w.id]={amount:r.amount,days:r.days,date:TODAY});commit(rs.length?'Πληρώθηκαν '+rs.length+' εργαζόμενοι, σύνολο '+eur(rs.reduce((s,r)=>s+r.amount,0))+'.':'Δεν υπάρχουν εκκρεμείς πληρωμές.');break}
    case 'vpreview':{const R=schedule();const d=nextWork(add(TODAY,1));const ws=S.workers.filter(w=>w.viber!==false&&w.phone&&(!isExt(w)||hasJob(R,w.id,[d])));
      document.getElementById('vpreview').innerHTML=`<p class="note" style="margin-top:10px">${ws.length} μηνύματα για ${fmt(d)}:</p><div class="vprev">${ws.map(w=>`<div><div class="lbl">${h(w.name)} · ${h(w.phone)}</div><pre>${h(personDayText(R,w,d))}</pre></div>`).join('')}</div>`;break}
    case 'vsend':{if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Θα σταλούν τώρα σε όλους. Πάτα ξανά';break}
      el.disabled=true;fetch('api/viber/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:TODAY})}).then(r=>r.json()).then(r=>{toast(r.message||'Η αποστολή ολοκληρώθηκε.');loadVStatus()}).catch(()=>toast('Η αποστολή απέτυχε. Δεν βρέθηκε ο server.')).finally(()=>{el.disabled=false;el.dataset.sure='';el.textContent='Αποστολή τώρα για σήμερα'});break}
    case 'export':{const ta=document.getElementById('io');ta.value=JSON.stringify(S);copy(ta.value,ta);break}
    case 'import':{try{const o=migrate(JSON.parse(document.getElementById('io').value));if(!o||o.v!==2||!Array.isArray(o.tasks))throw 0;setS(o);commit('Τα δεδομένα επαναφέρθηκαν.')}catch(err){toast('Το κείμενο δεν είναι έγκυρο αντίγραφο του ERGODO.')}break}
    case 'reset1':document.getElementById('resetbox').innerHTML='<span class="note">Θα χαθούν όλες οι αλλαγές σου.</span><button class="btn danger" data-act="reset2">Ναι, επαναφορά</button><button class="btn" data-act="reset0">Άκυρο</button>';break;
    case 'reset0':render();break;
    case 'reset2':setS(demo());UI.day=null;UI.week=null;commit('Φορτώθηκαν ξανά τα demo δεδομένα.');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.at!=null){const r=document.querySelector('#af input[name=asg][value=tasks]');if(r)r.checked=true;return}
  if(t.dataset.duty){S.dutyDone[t.dataset.duty]=t.checked;if(!t.checked)delete S.dutyDone[t.dataset.duty];save();toast(t.checked?'Σημειώθηκε ως έγινε.':'Σημειώθηκε ως εκκρεμές.');return}
  if(t.id==='fProj'||t.id==='fSpec'||t.id==='fStat'){UI[t.id]=t.value;render()}
  else if(t.id==='person'){UI.person=t.value;render()}
  else if(t.id==='u_w'){const w=W(t.value),f=document.getElementById('uf');if(!w)return;
    // συμπληρώνει όνομα, όνομα χρήστη (το κινητό του) και πρόσβαση από τον εργαζόμενο
    const n=document.getElementById('u_name'),u=document.getElementById('u_user');
    if(!n.value||f.dataset.auto)n.value=w.name;
    const ph=String(w.phone||'').replace(/\D/g,'');if(!u.value||f.dataset.auto)u.value=ph.length>=10?ph.slice(-10):'';
    if(f.dataset.auto)document.getElementById('u_role').value=SP(w.specialtyId)?.office?'office':'worker'}
  else if(t.id==='period'){UI.period=t.value;render()}
  else if(t.id==='pfrom'||t.id==='pto'){UI[t.id==='pfrom'?'from':'to']=t.value;render()}
  else if(t.id==='s_start'){S.settings.start=t.value||TODAY;commit('Η έναρξη άλλαξε. Το πρόγραμμα ξαναστήθηκε.')}
  else if(t.id==='s_auto'){S.settings.autoSend=t.checked;commit(t.checked?'Η αυτόματη αποστολή ενεργοποιήθηκε στις '+(S.settings.sendTime||'06:30')+'.':'Η αυτόματη αποστολή σταμάτησε.')}
  else if(t.id==='s_time'){S.settings.sendTime=t.value||'06:30';commit('Η ώρα αποστολής έγινε '+S.settings.sendTime+'.')}
  else if(t.dataset.viber){W(t.dataset.viber).viber=t.checked;save();toast(t.checked?'Θα λαμβάνει το πρόγραμμα στο Viber.':'Δεν θα λαμβάνει το πρόγραμμα στο Viber.')}
  else if(t.id==='apW'){UI.apW=t.value;render()}
  else if(t.id==='ap_proj'){const p=P(t.value),pl=document.getElementById('ap_place');if(p&&!pl.value.trim())pl.value=p.location||''}
  else if(t.id==='s_owner'){S.settings.ownerName=t.value.trim();commit('Το όνομα του εργολάβου στα ραντεβού έγινε «'+ownerName()+'».')}
  else if(t.id==='s_wx'){S.settings.wx=Object.assign(wxCfg(),{on:t.checked});commit(t.checked?'Το πρόγραμμα ακολουθεί την πρόγνωση καιρού.':'Το πρόγραμμα δεν λαμβάνει υπόψη τον καιρό.');if(t.checked)wxRefresh()}
  else if(t.id==='s_wprob'||t.id==='s_wmm'){const v=Math.max(0,+String(t.value).replace(',','.')||0);S.settings.wx=Object.assign(wxCfg(),t.id==='s_wprob'?{minProb:Math.min(100,v)}:{minMm:v});commit('Το όριο για βροχερή μέρα άλλαξε. Το πρόγραμμα ξαναστήθηκε.')}
  else if(t.id==='s_place')saveBase();
  else if(t.id==='s_fill'){S.settings.fillIdle=t.checked;commit(t.checked?'Όλοι έχουν δουλειά κάθε μέρα.':'Όσοι περισσεύουν μένουν χωρίς ανάθεση.')}
  else if(t.dataset.wd!=null){const d=+t.dataset.wd;const s=new Set(S.settings.workdays);t.checked?s.add(d):s.delete(d);if(!s.size){t.checked=true;toast('Χρειάζεται τουλάχιστον μία εργάσιμη μέρα.');return}S.settings.workdays=[...s].sort();commit('Οι εργάσιμες μέρες άλλαξαν.')}
  else if(t.dataset.re){
    const v=readTaskForm();
    const leads=leadOpts(v.specialtyId);
    document.getElementById('f_resp').outerHTML=sel('f_resp',[['','Αυτόματα'],...leads],leads.some(([id])=>id===v.responsibleId)?v.responsibleId:'');
    const deps=S.tasks.filter(x=>x.projectId===v.projectId&&x.id!==v.id);
    document.getElementById('f_after').outerHTML=sel('f_after',[['','Καμία προϋπόθεση'],...deps.map(x=>[x.id,x.title])],deps.some(x=>x.id===v.after)?v.after:'');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.body.classList.remove('nav-open')}});
// οι φόρμες δεν φορτώνουν ξανά τη σελίδα με Enter· η φόρμα σύνδεσης συνδέει
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;if(f.id!=='authf')return;
  const g=id=>{const x=document.getElementById(id);return x?x.value:''},err=document.getElementById('a_err'),btn=f.querySelector('.auth-go');
  err.textContent='';btn.disabled=true;
  try{
    if(f.dataset.mode==='setup'){if(g('a_pw')!==g('a_pw2'))throw new Error('Οι δύο κωδικοί δεν είναι ίδιοι.');enter(await authSetup({name:g('a_name'),username:g('a_user'),password:g('a_pw')}))}
    else{if(!g('a_user')||!g('a_pw'))throw new Error('Γράψε όνομα χρήστη και κωδικό.');enter(await authLogin(g('a_user'),g('a_pw'),document.getElementById('a_rem').checked))}
  }catch(x){if(document.getElementById('a_err')){err.textContent=x.message||'Κάτι πήγε στραβά. Δοκίμασε ξανά.';btn.disabled=false}}
});
async function loadVStatus(){const el=document.getElementById('vstatus');if(!el)return;
  try{const r=await fetch('api/viber/status',{cache:'no-store'});const st=await r.json();
    const badge=st.mode==='live'?'<span class="tag ok">Σύνδεση με πάροχο</span>':'<span class="tag warn">Δοκιμαστική λειτουργία: τα μηνύματα δεν φεύγουν, καταγράφονται μόνο</span>';
    el.innerHTML=`<div class="bar">${badge}<span>Τελευταία αυτόματη αποστολή: <b>${st.lastAuto?fmt(st.lastAuto):'καμία ακόμη'}</b></span></div>
    <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Ώρα</th><th>Εργαζόμενος</th><th>Τηλέφωνο</th><th>Αποτέλεσμα</th></tr></thead><tbody>${(st.log||[]).map(x=>`<tr><td class="mono">${h(x.at.slice(5,16).replace('T',' '))}</td><td>${h(x.name)}</td><td class="mono">${h(x.phone||'—')}</td><td>${x.status==='sent'?'<span class="tag ok">Στάλθηκε</span>':x.status==='dry'?'<span class="tag mute">Δοκιμή</span>':x.status==='skipped'?'<span class="tag mute">'+h(x.error)+'</span>':'<span class="tag bad">Σφάλμα</span> <span class="note">'+h(x.error||'')+'</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Δεν έχει γίνει καμία αποστολή.</td></tr>'}</tbody></table></div>`}
  catch(e){el.textContent='Δεν φορτώθηκε η κατάσταση αποστολών.'}}
// το «Get the job done» απλώνεται ώστε να έχει ακριβώς το ίδιο πλάτος με το ERGODO
function fitLogo(){
  document.querySelectorAll('.logo .wm').forEach(wm=>{
    const b=wm.querySelector('b'),t=wm.querySelector('small');if(!b||!t||!b.getBoundingClientRect().width)return;
    const n=t.textContent.length;t.style.letterSpacing='0px';t.style.marginRight='0px';
    const ls=(b.getBoundingClientRect().width-t.getBoundingClientRect().width)/(n-1);
    t.style.letterSpacing=ls+'px';t.style.marginRight=(-ls)+'px'});
}
fitLogo();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLogo);addEventListener('resize',fitLogo);
async function boot(){
  const a=await authMe();
  if(a.user){enter(a.user);if(a.offline)toast('Χωρίς σύνδεση με τον server. Βλέπεις τα τελευταία δεδομένα.')}
  else showAuth(a.setup?'setup':'login',a.msg||'');
}
window.addEventListener('focus',()=>{if(!SERVER||!AUTH.user||document.querySelector('.modal'))return;
  if(isWorker()){Object.keys(MY).forEach(k=>{if(k[0]!=='_')delete MY[k]});if(UI.tab==='mine')render()}else pull().then(ok=>{ok&&render();wxRefresh()})});
// η πρόγνωση ελέγχεται τακτικά· ξαναζητείται μόνο όταν παλιώσει
setInterval(()=>wxRefresh(),(SERVER?5:10)*60e3);
boot();
})();
