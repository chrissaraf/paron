  else if(t.id==='s_wprob'||t.id==='s_wmm'){const v=Math.max(0,+String(t.value).replace(',','.')||0);S.settings.wx=Object.assign(wxCfg(),t.id==='s_wprob'?{minProb:Math.min(100,v)}:{minMm:v});commit('Το όριο για βροχερή μέρα άλλαξε. Το πρόγραμμα ξαναστήθηκε.')}
  else if(t.id==='s_place')saveBase();
  else if(t.dataset.co){S.settings.company=Object.assign({},company(),{[t.dataset.co]:t.value.trim()});UI.hmsg='Στοιχεία εταιρείας: '+({name:'επωνυμία',afm:'ΑΦΜ',phone:'τηλέφωνο',addr:'διεύθυνση'}[t.dataset.co]||'')+' «'+t.value.trim()+'»';note(t.dataset.co==='name'?(t.value.trim()?'Η επωνυμία μπαίνει στα μηνύματα.':'Η επωνυμία βγήκε από τα μηνύματα.'):'Τα στοιχεία της εταιρείας αποθηκεύτηκαν.')}
  else if(t.id==='s_stime'){S.settings.startTime=t.value;commit(t.value?'Η ώρα έναρξης '+t.value+' μπαίνει στο μήνυμα της ημέρας.':'Η ώρα έναρξης βγήκε από τα μηνύματα.')}
  else if(t.id==='s_hol'){S.settings.hol=Object.assign(holDefaults(),S.settings.hol,{on:t.checked});commit(t.checked?'Τις αργίες δεν μπαίνει πρόγραμμα.':'Οι αργίες μετράνε ως κανονικές εργάσιμες.')}
  else if(t.dataset.hol){const hol=Object.assign(holDefaults(),S.settings.hol);const sk=new Set(hol.skip||[]);t.checked?sk.delete(t.dataset.hol):sk.add(t.dataset.hol);hol.skip=[...sk];S.settings.hol=hol;
    const n=HOLIDAYS.find(x=>x[0]===t.dataset.hol)[1];commit(t.checked?n+': αργία, χωρίς πρόγραμμα.':n+': κανονική εργάσιμη.')}
  else if(t.id==='s_payday'){S.settings.payDay=+t.value;commit('Μέρα πληρωμής: '+DAYF[+t.value]+'.')}
  else if(t.id==='s_paym'){S.settings.payMethod=t.value;note('Συνήθης τρόπος πληρωμής: '+payM(t.value).toLowerCase()+'.')}
  else if(t.id==='s_carry'){S.settings.payCarry=t.checked;commit(t.checked?'Τα υπόλοιπα περνούν στην επόμενη εβδομάδα.':'Κάθε εβδομάδα μετρά μόνη της, χωρίς μεταφορά υπολοίπου.')}
  else if(t.id==='s_payfrom'){if(!t.value)return;S.settings.payFrom=weekStart(t.value);commit('Τα υπόλοιπα μετράνε από την εβδομάδα '+fmtS(S.settings.payFrom)+'.')}
  else if(t.dataset.dw){S.settings.defWage=Object.assign({},S.settings.defWage,{[t.dataset.dw]:Math.max(0,+t.value||0)});note('Νέος '+ROLES[t.dataset.dw].toLowerCase()+': '+eur(defWage(t.dataset.dw))+' μεροκάματο.')}
  else if(t.id==='h_role'){const f=document.getElementById('wf'),i=document.getElementById('h_wage');if(f&&f.dataset.new==='1'&&Object.keys(DEFW).some(k=>+i.value===defWage(k)))i.value=defWage(t.value)}
  else if(t.id==='s_rate'){S.settings.rate=Object.assign(rateCfg(),{on:t.checked});commit(t.checked?'Το πρόγραμμα βάζει τους πιο έμπειρους στις δύσκολες εργασίες, με εναλλαγή.':'Το πρόγραμμα δεν λαμβάνει υπόψη βαθμούς και δυσκολία.')}
  else if(t.id==='s_rhard'||t.id==='s_rstreak'||t.id==='s_rbonus'){const v=Math.max(t.id==='s_rbonus'?0:1,Math.round(+t.value||0)),k={s_rhard:'hard',s_rstreak:'streak',s_rbonus:'bonus'}[t.id];S.settings.rate=Object.assign(rateCfg(),{[k]:k==='streak'?Math.min(10,v):k==='bonus'?Math.min(100,v):Math.min(5,Math.max(3,v))});
    commit(k==='bonus'?(v?'Η πρόταση μπόνους είναι '+S.settings.rate.bonus+'%.':'Χωρίς πρόταση μπόνους.'):k==='streak'?'Μετά από '+S.settings.rate.streak+(S.settings.rate.streak==1?' μέρα':' μέρες')+' σε δύσκολη ακολουθεί πιο ελαφριά.':'Δύσκολες θεωρούνται οι εργασίες με δυσκολία '+S.settings.rate.hard+' και πάνω.')}
  else if(t.id==='s_fill'){S.settings.fillIdle=t.checked;commit(t.checked?'Όλοι έχουν δουλειά κάθε μέρα.':'Όσοι περισσεύουν μένουν χωρίς ανάθεση.')}
  else if(t.dataset.wd!=null){const d=+t.dataset.wd;const s=new Set(S.settings.workdays);t.checked?s.add(d):s.delete(d);if(!s.size){t.checked=true;toast('Χρειάζεται τουλάχιστον μία εργάσιμη μέρα.');return}S.settings.workdays=[...s].sort();commit('Οι εργάσιμες μέρες άλλαξαν.')}
  else if(t.dataset.re){
    const v=readTaskForm();
    const leads=leadOpts(v.specialtyId);
    document.getElementById('f_resp').outerHTML=sel('f_resp',[['','Αυτόματα'],...leads],leads.some(([id])=>id===v.responsibleId)?v.responsibleId:'');
    const deps=S.tasks.filter(x=>x.projectId===v.projectId&&x.id!==v.id);
    document.getElementById('f_after').outerHTML=sel('f_after',[['','Καμία προϋπόθεση'],...deps.map(x=>[x.id,x.title])],deps.some(x=>x.id===v.after)?v.after:'');
  }
});
// το «μένουν» στις φόρμες πληρωμής αλλάζει καθώς γράφεται το ποσό
function updPay(){const f=document.getElementById('payf'),o=document.getElementById('p_after');if(f&&o)o.innerHTML=payAfter(+f.dataset.rest,num(document.getElementById('p_amount').value))}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q')searchRun(t.value);else if(t.id==='cq')cliFilter(t.value);else if(t.id==='p_amount')updPay();
  else if(t.id==='ml_from'||t.id==='ml_to'){const fr=document.getElementById('ml_from'),to=document.getElementById('ml_to'),n=document.getElementById('ml_days');if(t===fr&&to&&(!to.value||to.value<fr.value))to.value=fr.value;if(n)n.textContent=lvCount()}
  else if(t.id==='c_amount'){const f=document.getElementById('cpf'),o=document.getElementById('c_after');if(f&&o)o.innerHTML=cAfter(+f.dataset.rest,num(t.value))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){guideRead();closeModal();document.body.classList.remove('nav-open')}
  else if(e.key==='Enter'&&e.target.id==='q'){const r=document.querySelector('#qres .qrow');if(r){e.preventDefault();r.click()}}
  // «/» ανοίγει την αναζήτηση, όταν δεν γράφεις κάπου
  else if(e.key==='/'&&AUTH.user&&!isWorker()&&hasF('search')&&!e.target.closest('input,textarea,select,[contenteditable]')&&!document.querySelector('.modal')){e.preventDefault();searchForm()}});
// οι φόρμες δεν φορτώνουν ξανά τη σελίδα με Enter· η φόρμα σύνδεσης συνδέει
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;if(f.id!=='authf')return;
  const g=id=>{const x=document.getElementById(id);return x?x.value:''},err=document.getElementById('a_err'),btn=f.querySelector('.auth-go');
  err.textContent='';btn.disabled=true;
  try{
    if(f.dataset.mode==='setup'){if(g('a_pw')!==g('a_pw2'))throw new Error('Οι δύο κωδικοί δεν είναι ίδιοι.');UI.firstRun=true;enter(await authSetup({name:g('a_name'),username:g('a_user'),password:g('a_pw')}))}
    else{if(!g('a_user')||!g('a_pw'))throw new Error('Γράψε όνομα χρήστη και κωδικό.');enter(await authLogin(g('a_user'),g('a_pw'),document.getElementById('a_rem').checked))}
  }catch(x){if(document.getElementById('a_err')){err.textContent=x.message||'Κάτι πήγε στραβά. Δοκίμασε ξανά.';btn.disabled=false}}
});
async function loadVStatus(){const el=document.getElementById('vstatus');if(!el)return;
  try{const r=await fetch('api/viber/status',{cache:'no-store'});const st=await r.json();
    const badge=st.mode==='live'?'<span class="tag ok">Σύνδεση με πάροχο</span>':'<span class="tag warn">Δοκιμαστική λειτουργία: τα μηνύματα δεν φεύγουν, καταγράφονται μόνο</span>';
    el.innerHTML=`<div class="bar">${badge}<span>Τελευταία αυτόματη αποστολή: <b>${st.lastAuto?fmt(st.lastAuto):'καμία ακόμη'}</b></span></div>
    <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Ώρα</th><th>Εργαζόμενος</th><th>Τηλέφωνο</th><th>Αποτέλεσμα</th></tr></thead><tbody>${(st.log||[]).map(x=>`<tr><td class="mono">${h(x.at.slice(5,16).replace('T',' '))}</td><td>${h(x.name)}${x.kind==='sum'?' <span class="note">σύνοψη εβδομάδας</span>':''}</td><td class="mono">${h(x.phone||'—')}</td><td>${x.status==='sent'?'<span class="tag ok">Στάλθηκε</span>':x.status==='dry'?'<span class="tag mute">Δοκιμή</span>':x.status==='skipped'?'<span class="tag mute">'+h(x.error)+'</span>':'<span class="tag bad">Σφάλμα</span> <span class="note">'+h(x.error||'')+'</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Δεν έχει γίνει καμία αποστολή.</td></tr>'}</tbody></table></div>`}
  catch(e){el.textContent='Δεν φορτώθηκε η κατάσταση αποστολών.'}}
// το σύνθημα απλώνεται ώστε να έχει ακριβώς το ίδιο πλάτος με το όνομα
function fitLogo(){
  document.querySelectorAll('.logo .wm').forEach(wm=>{
    const b=wm.querySelector('b'),t=wm.querySelector('small');if(!b||!t||!b.getBoundingClientRect().width)return;
    const n=t.textContent.length;t.style.letterSpacing='0px';t.style.marginRight='0px';
    const ls=(b.getBoundingClientRect().width-t.getBoundingClientRect().width)/(n-1);
    t.style.letterSpacing=ls+'px';t.style.marginRight=(-ls)+'px'});
}
fitLogo();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLogo);addEventListener('resize',fitLogo);
async function boot(){
  const a=await authMe();
  if(a.user){enter(a.user);if(a.offline)toast('Χωρίς σύνδεση με τον server. Βλέπεις τα τελευταία δεδομένα.')}
  else showAuth(a.setup?'setup':'login',a.msg||'');
}
window.addEventListener('focus',()=>{if(!SERVER||!AUTH.user||document.querySelector('.modal'))return;
  if(isWorker()){Object.keys(MY).forEach(k=>{if(k[0]!=='_')delete MY[k]});if(UI.tab==='mine')render()}else pull().then(ok=>{ok&&render();wxRefresh()})});
// η πρόγνωση ελέγχεται τακτικά· ξαναζητείται μόνο όταν παλιώσει
setInterval(()=>wxRefresh(),(SERVER?5:10)*60e3);
// με τον server, το Σήμερα ξαναδιαβάζει τα δεδομένα κάθε 2 λεπτά, για να φαίνονται όσα στέλνουν από το εργοτάξιο
setInterval(()=>{const ae=document.activeElement;if(!SERVER||!AUTH.user||isWorker()||UI.tab!=='today'||saveT||document.hidden||document.querySelector('.modal')||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))return;
  const was=LAST;pull(false,true).then(ok=>{if(ok&&LAST!==was)render()})},120e3);
boot();
})();
</script>
