<title>PARON Εστίαση</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400..800&family=Fira+Sans+Condensed:wght@700;800&display=swap">
<style>
/* Διάταξη: πλαϊνό μενού σε υπολογιστή, κάτω μπάρα σε κινητό. Χρώματα PARON (δάσος, ελιά, φασκόμηλο). */
:root{
  --bg:#E8ECE4; --card:#F6F8F3; --ink:#14231F; --muted:#56645E; --line:#D3DAD0;
  --brand:#0E3B34; --deep:#0B2C27; --on-brand:#C2CF7E; --accent:#C2CF7E;
  --soft:#E8EDCD; --soft-ink:#2E5310;
  --ok:#2C6A39; --ok-bg:#DCEBD9; --warn:#8A5200; --warn-bg:#F6E7C8; --bad:#A3302A; --bad-bg:#F5DAD6;
  --est:#B9C4B4;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-logo:"Fira Sans Condensed","Arial Narrow",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07201C; --card:#0B2C27; --ink:#E6ECE4; --muted:#9DB0A8; --line:#1E4A42;
  --brand:#C2CF7E; --deep:#041814; --on-brand:#0B2C27; --accent:#C2CF7E;
  --soft:#1C4532; --soft-ink:#DCE6AE;
  --ok:#9FD3A6; --ok-bg:#163A23; --warn:#F0C674; --warn-bg:#3A2E12; --bad:#F2A49C; --bad-bg:#3D1C19; --est:#3A5C54;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07201C; --card:#0B2C27; --ink:#E6ECE4; --muted:#9DB0A8; --line:#1E4A42;
  --brand:#C2CF7E; --deep:#041814; --on-brand:#0B2C27; --accent:#C2CF7E;
  --soft:#1C4532; --soft-ink:#DCE6AE;
  --ok:#9FD3A6; --ok-bg:#163A23; --warn:#F0C674; --warn-bg:#3A2E12; --bad:#F2A49C; --bad-bg:#3D1C19; --est:#3A5C54;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mob,.mobi{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}

/* Κέλυφος */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--deep);color:#E6ECE4;padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:1px;font-family:var(--f-logo);font-weight:800;font-size:30px;letter-spacing:.5px;color:#F6F8F3;line-height:1}
.logo .o{width:26px;height:26px;border-radius:50%;background:#C2CF7E;display:inline-grid;place-items:center;margin:0 1px}
.logo .o svg{width:16px;height:16px;fill:#0E3B34}
.brandsub{font-size:12.5px;color:#9DB0A8;margin-top:6px;letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#CBD6CF;padding:11px 12px;border-radius:10px;text-align:left;font-weight:500}
.nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:#12403A}
.nav button.on{background:#C2CF7E;color:#0B2C27;font-weight:650}
.side .co{margin-top:auto;font-size:13px;color:#9DB0A8;border-top:1px solid #1E4A42;padding-top:14px}
.side .co b{display:block;color:#E6ECE4;font-weight:600}
main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%}
.mtop{display:none}
.tabbar{display:none}

h1{font-size:24px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:13.5px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.head .grow{flex:1;min-width:200px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:550;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.ic{width:36px;height:36px;padding:0;display:inline-grid;place-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 13px;font-weight:550;font-size:14px}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.wk{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.wk button{border:0;background:none;width:32px;height:30px;border-radius:8px;font-size:18px;line-height:1}
.wk button:hover{background:var(--soft)}
.wk span{min-width:150px;text-align:center;font-weight:600;font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
.grid2>*,.stack>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--soft-ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.note{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn);margin-bottom:16px}
.note.info{background:var(--soft);color:var(--soft-ink)}
.note button{margin-left:8px}

/* Πρόγραμμα: ημέρες */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.day .d{font-size:12.5px;color:var(--muted)}
.day .n{font-size:19px;font-weight:700;line-height:1.1}
.day .f{font-size:11.5px;font-weight:600;color:var(--ok)}
.day .f.short{color:var(--bad)}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day.on .d,.day.on .f{color:var(--on-brand)}
.day.today .n::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:3px auto 0}
.shift h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.shift h2 .t{font-weight:500;color:var(--muted);font-size:14px}
.shift .lead{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:13.5px;color:var(--muted)}
.shift .lead select{max-width:220px}
.role{border-top:1px solid var(--line);padding:10px 0 8px;display:grid;grid-template-columns:132px 1fr;gap:6px 12px;align-items:start}
.role:last-child{padding-bottom:0}
.role .rn{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 9px;font-size:13.5px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-size:11.5px}
.chip.lead{border-color:var(--brand)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip.add{border-style:dashed;color:var(--muted);background:none}
.chip:hover{border-color:var(--muted)}

/* Πίνακες */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.grp td{background:var(--soft);color:var(--soft-ink);font-weight:650;font-size:13px;padding:5px 10px}
.wgrid td.c{text-align:center;padding:4px}
.cell{min-width:86px;height:40px;border-radius:8px;border:1px dashed var(--line);background:none;font-weight:700;font-size:12.5px;line-height:1.15;padding:2px 6px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center}
.cell small{font-weight:500;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.cell.s0{background:var(--soft);color:var(--soft-ink);border:1px solid transparent}
.cell.s1{background:var(--brand);color:var(--on-brand);border:1px solid transparent}
.cell.s2{background:var(--accent);color:#0B2C27;border:1px solid transparent}
.nadj{display:inline-flex;align-items:center;gap:3px}
.nadj button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-weight:700;line-height:1;padding:0}
.daynote{font-size:10.5px;font-weight:700;color:var(--warn);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.on .daynote{color:var(--on-brand)}
.wdays{display:flex;gap:3px}
.wdays.wrap{flex-wrap:wrap}
/* φίλτρο βαρδιών (κύλιση στο κινητό) */
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding:1px 0 3px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.fchips button b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.fchips button b.bad{color:var(--bad)}
.fchips button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fchips button.on b{color:var(--on-brand)}
.pgbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.pgbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.step button{width:38px;height:34px;border:0;background:none;font-size:18px;font-weight:700;line-height:1;padding:0}
.step button:active{background:var(--soft)}
.step span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.nrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.nrow.tot{font-weight:650}
.scard{display:flex;flex-direction:column;gap:12px}
.scard .lbl{font-weight:600;margin-bottom:-6px}
.form.tt{grid-template-columns:1fr 1fr auto;align-items:end}
.form.t3{grid-template-columns:repeat(3,minmax(0,1fr));align-items:end}
.hrs{display:flex;flex-direction:column;padding-bottom:8px;font-size:13.5px}
.srow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;min-height:56px}
.srow .sub{display:block;margin-top:1px}
.srow .chev{color:var(--muted);font-size:22px;line-height:1}
.sgrp{background:var(--soft);color:var(--soft-ink);font-weight:650;font-size:13px;padding:6px 10px;margin:0 -16px;padding-left:16px}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow .sub{display:block;font-size:13px}
.pa{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pa>b{font-size:16px}
details.help summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
details.help[open] summary{margin-bottom:6px}
.amt>span{display:block}
.wdays button{border:1px solid var(--line);background:none;border-radius:7px;padding:4px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.wdays button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
/* παρουσίαση προγράμματος */
.roster h2{margin-bottom:10px}
.roster table{min-width:640px}
.roster th{text-align:center;font-size:12.5px;line-height:1.25}
.roster th span{font-weight:500}
.roster th em{font-style:normal;color:var(--warn);font-size:11px}
.roster th.td{color:var(--ink)}
.roster td{text-align:center;padding:6px 4px}
.roster .nm{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--card);font-weight:600;padding-left:0}
.sl{display:inline-block;min-width:64px;border-radius:7px;padding:4px 6px;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.sl.s0{background:var(--soft);color:var(--soft-ink)}
.sl.s1{background:var(--brand);color:var(--on-brand)}
.sl.s2{background:var(--accent);color:#0B2C27}
.sl.off{color:var(--muted);font-weight:500;font-size:12px}
.sl.lv{color:var(--bad);background:var(--bad-bg)}
.zn{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:-4px 0 4px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i.sl{min-width:0;width:18px;height:12px;padding:0}
.cell.cbad{box-shadow:inset 0 0 0 2px var(--bad)}
.cell.off{border:0;color:var(--muted);font-weight:500;font-size:11.5px}

/* Παρουσίες */
.arow{display:grid;grid-template-columns:minmax(150px,1.4fr) auto auto minmax(110px,.8fr);gap:8px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.arow .who b{display:block;font-weight:600}
.arow .who span{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.st button{border:0;background:var(--card);padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--muted)}
.st button.y.on{background:var(--ok-bg);color:var(--ok)}
.st button.x.on{background:var(--bad-bg);color:var(--bad)}
.times{display:flex;gap:8px;align-items:center}
.times label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
.times input{width:112px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.times input:disabled{opacity:.45}
.amt{text-align:right;font-size:13.5px}
.amt b{display:block;font-size:14.5px}
.wgrid td:first-child,.wgrid th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.wgrid tr.grp td:first-child{background:var(--soft)}
label.chk{display:flex;gap:8px;align-items:center;min-height:44px;font-size:14px}label.chk input{width:20px;height:20px;accent-color:var(--brand,#0E3B34)}.pex{line-height:1.6}
.amt .ot{color:var(--warn);font-weight:600}
.arow.no .who b{text-decoration:line-through;color:var(--muted)}

/* Κόστος */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:700;margin-top:2px}
.kpi.main{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.kpi.main span{color:var(--on-brand);opacity:.85}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:200px;padding-top:24px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bcol .v{font-size:12px;font-weight:600;white-space:nowrap}
.bcol .b{width:100%;max-width:56px;border-radius:6px 6px 2px 2px;background:var(--brand)}
.bcol .b.est{background:var(--est)}
.bcol .l{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Πληρωμές */
.weeks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.weeks button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:1px}
.weeks button b{font-size:14px}
.weeks button.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.paybtn{min-width:118px}
.paid{color:var(--ok);font-weight:600;font-size:13px}

/* Ρυθμίσεις */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted);font-weight:500}
.form>*{min-width:0}
label.f input,label.f select{width:100%;min-width:0}
label.f input,label.f select,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
td .inp{padding:5px 7px;width:100%;min-width:70px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

/* Παράθυρο */
.scrim{position:fixed;inset:0;background:rgba(4,20,17,.45);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--card);border-radius:16px;padding:20px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--card);padding:10px 0 4px;margin-bottom:-4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#E6ECE4;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;background:var(--deep);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
  .mtop .logo{font-size:24px}.mtop .logo .o{width:21px;height:21px}.mtop .logo .o svg{width:13px;height:13px}
  .mtop span{color:#9DB0A8;font-size:13px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:5px 0;border-radius:10px;font-weight:550}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on svg{background:var(--accent);color:#0B2C27;border-radius:999px;padding:2px 12px;width:46px;box-sizing:border-box;height:26px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

  return S;
}

/* ---------- Πυρήνας ---------- */
const staffOf=(S,id)=>S.staff.find(p=>p.id===id)||{name:'(διαγράφηκε)',role:'',rate:0};
const roleOf=(S,id)=>S.roles.find(r=>r.id===id)||{name:'',one:'',wage:0,ot:0,cut:0};
// Βάρδιες μιας μέρας: οι σταθερές που τρέχουν εκείνη τη μέρα της εβδομάδας + οι έκτακτες της ημερομηνίας.
const shiftsOn=(S,d)=>S.shifts.filter(sh=>!sh.days||sh.days.includes(dow(d))).concat((S.dayShifts||{})[d]||[]);
const dayShiftOf=(S,d,id)=>((S.dayShifts||{})[d]||[]).find(x=>x.id===id);
const shiftOf=(S,id)=>S.shifts.find(s=>s.id===id)||Object.values(S.dayShifts||{}).flat().find(s=>s.id===id)||{name:'',a:'00:00',b:'00:00'};
// Ποιος μετράει σε μια βάρδια: όσοι είναι σε αυτήν και όσοι την καλύπτουν με παράταση ωραρίου (e.cov).
const inSh=(e,sid)=>e.s===sid||e.cov===sid;
const forRole=(sh,rid)=>!sh.roles||sh.roles.includes(rid);
// Μέρες που δουλεύει ένα άτομο: p.days (λίστα 0=Δευ…6=Κυρ) αν έχουν οριστεί, αλλιώς όλες εκτός από το σταθερό ρεπό.
const worksOn=(p,d)=>p.days?p.days.includes(dow(d)):p.off!==dow(d);
const needOf=(S,d,sid,rid)=>{const o=(((S.dayNeeds||{})[d]||{})[sid]||{})[rid];if(o!=null&&!dayShiftOf(S,d,sid))return o;return baseNeed(S,d,sid,rid)};
const baseNeed=(S,d,sid,rid)=>{const x=dayShiftOf(S,d,sid);if(x)return(x.need||{})[rid]||0;const sh=S.shifts.find(s=>s.id===sid);if(!sh||(sh.days&&!sh.days.includes(dow(d)))||!forRole(sh,rid))return 0;return((S.needs[dow(d)]||{})[sid]||{})[rid]||0};
const daysLbl=p=>p.days?'Μόνο '+p.days.map(i=>DN[i]).join(', '):p.off>=0?'Ρεπό '+DF[p.off]:'Όλες τις μέρες';
const pick=(v,dflt)=>v==null||v===''?+dflt||0:+v;
const payOf=(S,p)=>{const r=roleOf(S,p.role);return{wage:pick(p.wage,r.wage),ot:pick(p.ot,r.ot),cut:pick(p.cut,r.cut)}};
// Βασικό ωράριο ανά πόστο: το μεροκάματο αντιστοιχεί σε bh ώρες (π.χ. 9). Προαιρετικά μεγάλη βάρδια:
// από lh ώρες (π.χ. 12) πληρώνεται lx φορές το μεροκάματο (π.χ. 1,5). Πάνω από τη βάση = υπερωρία, κάτω = κράτηση.
const tiersOf=r=>{const bh=+r.bh>0?+r.bh:9,t=[{h:bh,x:1}];if(r.lon&&+r.lh>bh&&+r.lx>0)t.push({h:+r.lh,x:+r.lx});return t};
function payCalc(S,p,plan,h){const r=roleOf(S,p.role),pr=payOf(S,p),T=tiersOf(r);const ref=Math.max(plan,h);let t=T[0];T.forEach(x=>{if(ref>=x.h-1e-6)t=x});
  const base=pr.wage*t.x,ot=Math.max(0,h-t.h),sh=Math.max(0,t.h-h),otc=ot*pr.ot,cutc=Math.min(base,sh*pr.cut);
  return{base,x:t.x,th:t.h,ot,sh,otc,cutc,cost:base+otc-cutc}}
const payEx=(S,r)=>{const p={role:r.id},T=tiersOf(r),b=T[0].h;const hs=[b-1,b,b+1];if(T[1])hs.push(T[1].h,T[1].h+1);
  return 'Παράδειγμα: '+[...new Set(hs)].filter(x=>x>0).map(x=>`<span style="white-space:nowrap">${String(x).replace('.',',')} ώρες <b>${eur(payCalc(S,p,x,x).cost)}</b></span>`).join(' · ')};
const payDate=(S,ws)=>addD(ws,7+(+S.set.payDay||0));

// Αιτήματα: άδεια (από–έως), δεν μπορεί μια μέρα (όλη ή ώρες), κάθε εβδομάδα (μέρα, όλη ή ώρες).
function iv(a,b){const x=mins(a);let y=mins(b);if(y<=x)y+=1440;return[x,y]}
function reqHit(q,d,a,b){
  if(q.k==='leave')return d>=q.from&&d<=(q.to||q.from);
  const on=q.k==='week'?dow(d)===+q.wd:d===q.from;if(!on)return false;
  if(q.all||!a)return true;const[s1,e1]=iv(a,b),[s2,e2]=iv(q.a,q.b);return s1<e2&&s2<e1;
}
function blockOf(S,pid,d,a,b){return(S.reqs||[]).find(q=>q.p===pid&&reqHit(q,d,a,b))}
const REQK={leave:'Άδεια',day:'Δεν μπορεί',week:'Κάθε εβδομάδα'};
function reqText(q){
  const t=q.all===false?` ${q.a}–${q.b}`:' όλη μέρα';
  if(q.k==='leave')return`Άδεια ${dm(q.from)}${q.to&&q.to!==q.from?' – '+dm(q.to):''}`;
  if(q.k==='day')return`Δεν μπορεί ${DN[dow(q.from)]} ${dm(q.from)}${t}`;
  return`Κάθε ${DF[+q.wd]} δεν μπορεί${t}`;
}
// Μετά από αλλαγή στα άτομα: προσαρμόζει τις ήδη φτιαγμένες μέρες από σήμερα ως το τέλος του επόμενου προγράμματος.
function refit(S,test){const out={added:0,removed:0,short:0};const ws=schedStart(TODAY);
  [ws,addD(ws,7)].forEach(w=>{const ds=[];for(let i=0;i<7;i++){const d=addD(w,i);if(d>=TODAY&&(S.sched[d]||[]).length&&(!test||test(d)))ds.push(d)}
    if(ds.length){const r=autoWeek(S,w,ds);out.added+=r.added;out.removed+=r.removed;out.short+=r.short}});return out}
function refitMsg(r){const t=[];if(r.added)t.push(`μπήκαν ${r.added}`);if(r.removed)t.push(`βγήκαν ${r.removed}`);if(r.short)t.push(`λείπουν ακόμα ${r.short}`);return t.length?'Το πρόγραμμα άλλαξε: '+t.join(', '):''}
function conflicts(S,ws){const out=[];for(let i=0;i<7;i++){const d=addD(ws,i);if(d<TODAY)continue;(S.sched[d]||[]).forEach(e=>{const q=blockOf(S,e.p,d,e.a,e.b);if(q)out.push({d,e,q})})}return out}
// Φέρνει τις μέρες (από σήμερα και μετά) στα άτομα που ζητούνται: βάζει όσους λείπουν και βγάζει όσους περισσεύουν.
// Δεν βγάζει όποιον έχει ήδη παρουσία. days: λίστα ημερομηνιών, αλλιώς όλη η εβδομάδα.
function autoWeek(S,ws,days){
  const count={};S.staff.forEach(p=>count[p.id]=0);
  for(let i=0;i<7;i++)(S.sched[addD(ws,i)]||[]).forEach(e=>count[e.p]=(count[e.p]||0)+1);
  let added=0,short=0;
  let removed=0;
  for(let i=0;i<7;i++){const d=addD(ws,i);if(days&&!days.includes(d))continue;const day=S.sched[d]=S.sched[d]||[];
    shiftsOn(S,d).forEach(sh=>S.roles.forEach(r=>{
      let need=needOf(S,d,sh.id,r.id)-day.filter(e=>inSh(e,sh.id)&&staffOf(S,e.p).role===r.id).length;
      if(need<0&&d>=TODAY){const A=S.att[d]||{};const extra=day.filter(e=>e.s===sh.id&&!e.cov&&staffOf(S,e.p).role===r.id&&!A[e.id]).sort((x,y)=>count[y.p]-count[x.p]);
        while(need<0&&extra.length){const e=extra.shift();day.splice(day.indexOf(e),1);count[e.p]--;need++;removed++}}
      if(need<=0)return;
      const busy=new Set(day.map(e=>e.p));
      const c=S.staff.filter(p=>p.active&&p.role===r.id&&!busy.has(p.id)&&worksOn(p,d)&&count[p.id]<(S.set.maxDays||6)&&!blockOf(S,p.id,d,sh.a,sh.b))
        .sort((x,y)=>count[x.id]-count[y.id]||((S.staff.indexOf(x)+i)%7)-((S.staff.indexOf(y)+i)%7));
      while(need>0&&c.length){const p=c.shift();day.push({id:nid('e'),p:p.id,s:sh.id,a:sh.a,b:sh.b});count[p.id]++;need--;added++}
      short+=need;
    }));
  }
  return{added,short,removed};
}

// Κόστος μιας βάρδιας ατόμου. Χωρίς παρουσία = εκτίμηση από το πρόγραμμα.
function entryCost(S,d,e){
  const p=staffOf(S,e.p),r=roleOf(S,p.role);const at=(S.att[d]||{})[e.id];
  if(at&&at.st==='no')return{h:0,ot:0,cost:0,otc:0,sh:0,cutc:0,st:'no',est:false};
  const a=at&&at.a||e.a,b=at&&at.b||e.b;const h=hoursBetween(a,b);
  // Μεροκάματο για το βασικό ωράριο του πόστου (ή μεγάλης βάρδιας), + υπερωρία, − κράτηση ανά ώρα.
  const c=payCalc(S,p,hoursBetween(e.a,e.b),h);let cost=c.cost;if(dow(d)===6&&+S.set.sunPct)cost*=1+S.set.sunPct/100;
  return{h,ot:c.ot,sh:c.sh,cost,otc:c.otc,cutc:c.cutc,base:c.base,x:c.x,st:at?'yes':'plan',est:!at,a,b};
}
function dayCost(S,d){
  const out={total:0,est:0,h:0,ot:0,otc:0,cutc:0,people:0,no:0,roles:{},shifts:{}};
  (S.sched[d]||[]).forEach(e=>{const c=entryCost(S,d,e);const rid=staffOf(S,e.p).role;
    const R=out.roles[rid]=out.roles[rid]||{n:0,h:0,ot:0,cost:0};const Sh=out.shifts[e.s]=out.shifts[e.s]||{n:0,cost:0};
    if(c.st==='no'){out.no++;return}
    out.total+=c.cost;if(c.est)out.est+=c.cost;out.h+=c.h;out.ot+=c.ot;out.otc+=c.otc;out.cutc+=c.cutc;out.people++;
    R.n++;R.h+=c.h;R.ot+=c.ot;R.cost+=c.cost;Sh.n++;Sh.cost+=c.cost});
  return out;
}
function weekPay(S,ws){
  const m={};
  for(let i=0;i<7;i++){const d=addD(ws,i);(S.sched[d]||[]).forEach(e=>{const c=entryCost(S,d,e);
    const r=m[e.p]=m[e.p]||{p:staffOf(S,e.p),n:0,h:0,ot:0,otc:0,cutc:0,total:0,est:0,no:0};
    if(c.st==='no'){r.no++;return}r.n++;r.h+=c.h;r.ot+=c.ot;r.otc+=c.otc;r.cutc+=c.cutc;r.total+=c.cost;if(c.est)r.est++})}
  const order=S.roles.map(r=>r.id);
  return Object.values(m).sort((a,b)=>order.indexOf(a.p.role)-order.indexOf(b.p.role)||a.p.name.localeCompare(b.p.name,'el'));
}

/* ---------- Πρόγραμμα ---------- */
function weekNav(act,label){return `<div class="wk"><button data-act="${act}" data-n="-1" aria-label="Προηγούμενη">‹</button><span>${label}</span><button data-act="${act}" data-n="1" aria-label="Επόμενη">›</button></div>`}
function fillOf(d){let need=0,have=0;const day=S.sched[d]||[];shiftsOn(S,d).forEach(sh=>S.roles.forEach(r=>{const n=needOf(S,d,sh.id,r.id);need+=n;have+=Math.min(n,day.filter(e=>inSh(e,sh.id)&&staffOf(S,e.p).role===r.id).length)}));return{need,have,total:day.length}}
function pageProg(){
  const ws=UI.ws;if(schedStart(UI.day)!==ws)UI.day=ws<=TODAY&&TODAY<=addD(ws,6)?TODAY:ws;

  let h=`<div class="head"><div class="grow"><h1>Πρόγραμμα</h1><div class="sub">Κάθε ${DF[PUB]} βγαίνει το πρόγραμμα ${DN[dow(nx)]}–${DN[dow(addD(nx,6))]}</div></div>
  <div class="bar">${weekNav('wk',swLabel(ws))}
  <div class="seg"><button data-act="view" data-v="day" class="${UI.view==='day'?'on':''}">Ημέρα</button><button data-act="view" data-v="week" class="${UI.view==='week'?'on':''}">Εβδομάδα</button><button data-act="view" data-v="share" class="${UI.view==='share'?'on':''}">Κοινοποίηση</button><button data-act="view" data-v="req" class="${UI.view==='req'?'on':''}">Αιτήματα${nreq?` <span class="pill" style="margin-left:4px">${nreq}</span>`:''}</button></div></div></div>`;
  if(UI.view==='req')return h+pageReq(nx);
  if(UI.view==='share')return h+pageShare(ws);
  const nxEmpty=!(S.sched[nx]||[]).length;
  if(ws!==nx&&nxEmpty&&addD(pubD,-3)<=TODAY)h+=`<div class="note info">${pubD===TODAY?'Σήμερα':DF[dow(pubD)]+' '+dm(pubD)} βγαίνει το πρόγραμμα ${swLabel(nx)}. Πέρασε πρώτα τα αιτήματα (${nreq}) και μετά φτιάξ' το.<button class="btn sm" data-act="view" data-v="req">Αιτήματα</button><button class="btn sm pri" data-act="gonext">Στο νέο πρόγραμμα</button></div>`;
  const cf=conflicts(S,ws);
  if(cf.length)h+=`<div class="note" style="background:var(--bad-bg);color:var(--bad)">${cf.length} ${cf.length===1?'βάρδια πέφτει':'βάρδιες πέφτουν'} πάνω σε αίτημα: ${cf.slice(0,3).map(x=>esc(staffOf(S,x.e.p).name)+' '+DN[dow(x.d)]).join(', ')}${cf.length>3?'…':''}.<button class="btn sm" data-act="fixcf">Αφαίρεση και αντικατάσταση</button></div>`;

  if(UI.view==='week')return h+progWeek(ws);

  h+='</div>';
  const d=UI.day,day=S.sched[d]||[],shs=shiftsOn(S,d);

  if(shs.length>1)h+=`<div class="fchips" aria-label="Βάρδιες"><button data-act="shf" data-v="" class="${!UI.shF?'on':''}">Όλες οι βάρδιες</button>${shs.map(sh=>{let lack=0;S.roles.forEach(r=>{lack+=Math.max(0,needOf(S,d,sh.id,r.id)-day.filter(e=>inSh(e,sh.id)&&staffOf(S,e.p).role===r.id).length)});return `<button data-act="shf" data-v="${sh.id}" class="${UI.shF===sh.id?'on':''}">${esc(sh.name)} <b class="${lack?'bad':''}">${lack?'−'+lack:day.filter(e=>e.s===sh.id).length}</b></button>`}).join('')}</div>`;

    h+=`<section class="card shift"><h2>${esc(sh.name)} <span class="t">${sh.a}–${sh.b} · ${inS.length} άτομα</span>${ex?` <span class="pill warn">μόνο ${DN[dow(d)]} ${dm(d)}</span> <button class="btn sm" data-act="exshift" data-d="${d}" data-id="${sh.id}">Αλλαγή</button>`:(sh.days?` <span class="pill">${sh.days.map(i=>DN[i]).join(', ')}</span>`:'')+(sh.roles?` <span class="pill">${sh.roles.map(rid=>esc(roleOf(S,rid).name)).join(', ')}</span>`:'')}</h2>
    <div class="lead">Υπεύθυνος βάρδιας <select class="inp" data-ch="lead" data-k="${d}|${sh.id}"><option value="">—</option>${day.map(e=>staffOf(S,e.p)).sort((a,b)=>b.lead-a.lead).map(p=>`<option value="${p.id}" ${p.id===lead?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`;
    S.roles.forEach(r=>{const es=inS.filter(e=>staffOf(S,e.p).role===r.id);const n=needOf(S,d,sh.id,r.id);if(!n&&!es.length&&!baseNeed(S,d,sh.id,r.id)&&!(UI.showAll&&(ex||forRole(sh,r.id))))return;
      if(!ex&&!forRole(sh,r.id)&&!es.length)return;

      es.forEach(e=>{const p=staffOf(S,e.p);const diff=e.a!==sh.a||e.b!==sh.b;const q=blockOf(S,p.id,d,e.a,e.b);h+=`<button class="chip ${p.id===lead?'lead':''} ${q?'bad':''}" data-act="edit" data-d="${d}" data-id="${e.id}" ${q?`title="${esc(reqText(q))}"`:''}>${esc(p.name)}${diff?` <small>${e.a}–${e.b}</small>`:''}${e.z?` <small>${esc(e.z)}</small>`:''}${e.nt?` <small>${esc(e.nt)}</small>`:''}${e.cov?` <small>${e.cov===sh.id?'παράταση από '+esc(shiftOf(S,e.s).name):'καλύπτει και '+esc(shiftOf(S,e.cov).name)}</small>`:''}${q?' <small>αίτημα</small>':''}</button>`});
      h+=`<button class="chip add" data-act="add" data-d="${d}" data-s="${sh.id}" data-r="${r.id}">+ Προσθήκη</button>${d>=TODAY&&shs.length>1?`<button class="chip add" ${es.length<n?'style="color:var(--bad);border-color:var(--bad)"':''} data-act="cover" data-d="${d}" data-s="${sh.id}" data-r="${r.id}">Παράταση ωραρίου</button>`:''}</div></div>`});
    h+=`</section>`});

}
function progWeek(ws){

  for(let i=0;i<7;i++){const d=addD(ws,i);h+=`<th class="n" style="text-align:center">${DN[dow(d)]} ${pd(d).getDate()}</th>`}
  h+=`<th class="n">Βάρδιες</th></tr></thead><tbody>`;
  S.roles.forEach(r=>{const ps=S.staff.filter(p=>p.role===r.id&&p.active);if(!ps.length)return;
    h+=`<tr class="grp"><td colspan="9">${esc(r.name)}</td></tr>`;
    ps.forEach(p=>{let n=0;h+=`<tr><td style="white-space:nowrap">${nameHTML(p.name)}</td>`;
      for(let i=0;i<7;i++){const d=addD(ws,i);const e=(S.sched[d]||[]).find(x=>x.p===p.id);
        const q=blockOf(S,p.id,d,e&&e.a,e&&e.b);
        if(e){n++;const si=shiftsOn(S,d).findIndex(s=>s.id===e.s);const hh0=+e.a.slice(0,2);h+=`<td class="c"><button class="cell s${hh0<12?0:hh0<17?2:1} ${q?'cbad':''}" data-act="cyc" data-d="${d}" data-p="${p.id}" title="${esc(shiftOf(S,e.s).name)} ${e.a}–${e.b}${q?' · '+esc(reqText(q)):''}">${esc(shiftOf(S,e.s).name)}<small>${st(e.a)}–${st(e.b)}</small></button></td>`}
        else{const qd=blockOf(S,p.id,d);const lab=qd?(qd.k==='leave'?'άδεια':qd.all===false?'ώρες':'όχι'):!worksOn(p,d)?'ρεπό':'';h+=`<td class="c"><button class="cell ${lab?'off':''}" ${qd?`style="color:var(--bad)" title="${esc(reqText(qd))}"`:''} data-act="cyc" data-d="${d}" data-p="${p.id}">${lab}</button></td>`}}
      h+=`<td class="n">${n}</td></tr>`})});
  return h+'</tbody></table></div></div>';
}

function cellOf(p,d){const e=(S.sched[d]||[]).find(x=>x.p===p.id);if(e)return{e,t:st(e.a)+'–'+st(e.b),sh:shiftOf(S,e.s)};
  const q=blockOf(S,p.id,d);if(q&&(q.k==='leave'||q.all!==false))return{off:q.k==='leave'?'Άδεια':'Δεν μπορεί'};return{off:'Ρεπό'}}
function pageShare(ws){

    <button class="btn pri" data-act="copyroster" data-w="${ws}">Αντιγραφή για την ομάδα</button><button class="btn" data-act="persmsgs">Μήνυμα σε κάθε άτομο</button>
    ${(S.pub||{})[ws]?`<span class="pill ok">Κοινοποιήθηκε ${dm(S.pub[ws])}</span>`:`<span class="pill warn">Δεν έχει κοινοποιηθεί</span>`}</div><div class="lgd"><span><i class="sl s0"></i>Πρωί</span><span><i class="sl s2"></i>Μεσημέρι</span><span><i class="sl s1"></i>Βράδυ</span><span><i class="sl off lv"></i>Άδεια ή δεν μπορεί</span></div>`;
  S.roles.filter(r=>!rf||r.id===rf).forEach(r=>{const ps=S.staff.filter(p=>p.role===r.id&&(p.active||days.some(d=>(S.sched[d]||[]).some(e=>e.p===p.id))));if(!ps.length)return;
    h+=`<section class="card roster"><h2>${esc(r.name)} <span class="sub">${swLabel(ws)}</span></h2><div class="tw"><table><thead><tr><th class="nm">Όνομα</th>${days.map(d=>`<th class="${d===TODAY?'td':''}">${DN[dow(d)]}<br><span>${pd(d).getDate()}/${pd(d).getMonth()+1}</span>${S.dayNotes&&S.dayNotes[d]?`<br><em>${esc(S.dayNotes[d])}</em>`:''}</th>`).join('')}</tr></thead><tbody>`;
    ps.forEach(p=>{h+=`<tr><td class="nm">${nameHTML(p.name)}</td>${days.map(d=>{const c=cellOf(p,d);if(c.e){const hh=+c.e.a.slice(0,2),k=hh<12?0:hh<17?2:1;return `<td><span class="sl s${k}" title="${esc(c.sh.name)}">${c.t}</span><small class="zn">${esc([c.sh.name,c.e.z,c.e.nt].filter(Boolean).join(' · '))}</small></td>`}return `<td><span class="sl off ${c.off!=='Ρεπό'?'lv':''}">${c.off}</span></td>`}).join('')}</tr>`});
    h+=`</tbody></table></div></section>`});
  return `<div class="stack">${h}</div>`;
}
function rosterText(ws,rf){const days=[...Array(7)].map((_,i)=>addD(ws,i));let t=`${S.set.name}\nΠρόγραμμα ${swLabel(ws)}\n`;
  S.roles.filter(r=>!rf||r.id===rf).forEach(r=>{const ps=S.staff.filter(p=>p.role===r.id&&p.active);if(!ps.length)return;t+=`\n${r.name}\n`;

  return t}
function personText(ws,p){const days=[...Array(7)].map((_,i)=>addD(ws,i));
  return `${p.name.split(' ')[0]}, το πρόγραμμά σου για ${swLabel(ws)}:\n`+days.map(d=>{const c=cellOf(p,d);return `${DN[dow(d)]} ${pd(d).getDate()}/${pd(d).getMonth()+1}: ${c.e?c.t+' '+(c.e.z||c.sh.name)+(c.e.nt?' ('+c.e.nt+')':''):c.off}`}).join('\n')+`\n${S.set.name}`}
function copyText(t,msg){const done=()=>toast(msg||'Αντιγράφηκε');try{navigator.clipboard.writeText(t).then(done,()=>showText(t))}catch(e){showText(t)}}
function persSheet(ws){const rf=UI.shRole||'';const ps=S.staff.filter(p=>p.active&&(!rf||p.role===rf)&&[...Array(7)].some((_,i)=>(S.sched[addD(ws,i)]||[]).some(e=>e.p===p.id)));

  <div class="stack" style="gap:8px">${ps.map(p=>`<div class="bar" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><div><b>${esc(p.name)}</b><br><span class="sub">${esc(roleOf(S,p.role).one)}${p.phone?' · '+esc(p.phone):''}</span></div><button class="btn sm" data-act="copyp" data-p="${p.id}" data-w="${ws}">Αντιγραφή</button></div>`).join('')}</div>

    h+='</section>'});

/* ---------- Κόστος ---------- */
function roleTable(roles,withOt){
  let h=`<div class="tw"><table><thead><tr><th>Ειδικότητα</th><th class="n">Μεροκάματα</th><th class="n hm">Ώρες</th><th class="n hm">Υπερωρίες</th><th class="n">Κόστος</th></tr></thead><tbody>`;
  let T={n:0,h:0,ot:0,cost:0};
  S.roles.forEach(r=>{const x=roles[r.id];if(!x||!x.n)return;T.n+=x.n;T.h+=x.h;T.ot+=x.ot;T.cost+=x.cost;

function pageCost(){

    h+=`<div class="grid2"><section class="card"><h2 style="margin-bottom:8px">Ανά ειδικότητα</h2>${roleTable(c.roles)}</section>
    <section class="card"><h2 style="margin-bottom:8px">Ανά βάρδια</h2><div class="tw"><table><thead><tr><th>Βάρδια</th><th class="n">Άτομα</th><th class="n">Κόστος</th></tr></thead><tbody>${shiftsOn(S,UI.costD).map(sh=>{const x=c.shifts[sh.id]||{n:0,cost:0};return `<tr><td>${esc(sh.name)} <span class="sub">${sh.a}–${sh.b}</span></td><td class="n">${x.n}</td><td class="n"><b>${eur(x.cost)}</b></td></tr>`}).join('')}</tbody></table></div></section></div>`;

  }
  const ws=UI.costWs;const days=[];const roles={};let T={total:0,est:0,h:0,otc:0,people:0};
  for(let i=0;i<7;i++){const d=addD(ws,i),c=dayCost(S,d);days.push([d,c]);T.total+=c.total;T.est+=c.est;T.h+=c.h;T.otc+=c.otc;T.people+=c.people;
    Object.entries(c.roles).forEach(([k,v])=>{const R=roles[k]=roles[k]||{n:0,h:0,ot:0,cost:0};R.n+=v.n;R.h+=v.h;R.ot+=v.ot;R.cost+=v.cost})}
  const mx=Math.max(1,...days.map(x=>x[1].total));

  if(T.est>0)h+=`<div class="note">${eur(T.est)} είναι εκτίμηση από το πρόγραμμα (μέρες χωρίς παρουσίες ή μέρες που δεν ήρθαν ακόμα).</div>`;
  h+=`<div class="grid2"><section class="card"><h2>Ανά ημέρα</h2><div class="bars">${days.map(([d,c])=>{const allEst=c.total>0&&c.est>=c.total-0.01;return `<div class="bcol"><span class="v num">${c.total?eur0(c.total):'—'}</span><div class="b ${allEst?'est':''}" style="height:${Math.max(2,c.total/mx*140)}px"></div><span class="l">${DN[dow(d)]} ${pd(d).getDate()}</span></div>`}).join('')}</div>
  <div class="legend"><span><i style="background:var(--brand)"></i>Με παρουσίες</span><span><i style="background:var(--est)"></i>Εκτίμηση από το πρόγραμμα</span></div></section>
  <section class="card"><h2 style="margin-bottom:8px">Ανά ειδικότητα</h2>${roleTable(roles)}</section></div>`;
  return h;
}

/* ---------- Πληρωμές ---------- */
function weekStatus(ws){const rows=weekPay(S,ws).filter(r=>r.total>0);const P=S.paid[ws]||{};const paid=rows.filter(r=>P[r.p.id]).length;return{rows,paid,open:rows.length-paid}}
function pageQueue(){
  // Εβδομάδες που φαίνονται: 5 περασμένες + τρέχουσα
  const cur=monday(TODAY);const list=[];for(let i=-5;i<=0;i++)list.push(addD(cur,i*7));
  return list.filter(ws=>Object.keys(S.sched).some(d=>d>=ws&&d<=addD(ws,6)&&(S.sched[d]||[]).length));
}
function pagePay(){
  const list=pageQueue();
  if(!UI.payWs||!list.includes(UI.payWs)){
    // προεπιλογή: η εβδομάδα που πληρώνεται την επόμενη (ή σημερινή) πληρωμή
    UI.payWs=list.filter(ws=>payDate(S,ws)>=TODAY)[0]||list[list.length-1]||monday(TODAY)}
  const ws=UI.payWs,pday=payDate(S,ws),st=weekStatus(ws),P=S.paid[ws]=S.paid[ws]||{};
  const pdn=DF[dow(pday)];
  let h=`<div class="head"><div class="grow"><h1>Πληρωμές</h1><div class="sub">Κάθε ${pdn.toLowerCase()} πληρώνεται η προηγούμενη εβδομάδα, Δευτέρα έως Κυριακή.</div></div></div>`;
  const older=list.filter(w=>w!==ws&&payDate(S,w)<TODAY&&weekStatus(w).open>0);
  older.forEach(w=>{h+=`<div class="note">Εκκρεμούν ${weekStatus(w).open} πληρωμές από την εβδομάδα ${wkLabel(w)}.<button class="btn sm" data-act="payws" data-w="${w}">Άνοιγμα</button></div>`});
  h+='<div class="weeks">'+list.slice().reverse().map(w=>{const s=weekStatus(w);const pdw=payDate(S,w);
    const tag=s.rows.length&&!s.open?'<span class="pill ok">Εξοφλήθηκε</span>':pdw<TODAY?`<span class="pill bad">${s.open} ανοιχτές</span>`:pdw===TODAY?'<span class="pill warn">Πληρώνεται σήμερα</span>':`<span class="pill">${DN[dow(pdw)]} ${dm(pdw)}</span>`;
    return `<button data-act="payws" data-w="${w}" class="${w===ws?'on':''}"><b>${wkLabel(w)}</b>${tag}</button>`}).join('')+'</div>';
  let rows=st.rows;const total=rows.reduce((a,r)=>a+r.total,0);const paidSum=rows.filter(r=>P[r.p.id]).reduce((a,r)=>a+P[r.p.id].amount,0);
  const estDays=rows.reduce((a,r)=>a+r.est,0);
  h+=`<div class="kpis"><div class="kpi main"><span>Πληρωμή ${pdn} ${dm(pday)}</span><b>${eur(total)}</b></div><div class="kpi"><span>Πληρώθηκαν</span><b>${eur(paidSum)}</b></div><div class="kpi"><span>Υπόλοιπο</span><b>${eur(Math.max(0,total-paidSum))}</b></div><div class="kpi"><span>Άτομα</span><b>${st.paid}/${rows.length}</b></div></div>`;
  if(addD(ws,6)>=TODAY)h+=`<div class="note">Η εβδομάδα δεν έχει τελειώσει. Τα ποσά αλλάζουν μέχρι να συμπληρωθούν όλες οι παρουσίες ως την Κυριακή.</div>`;
  else if(estDays)h+=`<div class="note">Λείπουν παρουσίες σε ${estDays} βάρδιες. Υπολογίστηκαν από το πρόγραμμα.</div>`;
  if(UI.payRole)rows=rows.filter(r=>r.p.role===UI.payRole);
  h+=`<section class="card pcard"><div class="head" style="margin-bottom:8px"><div class="grow bar"><select class="inp" data-ch="payrole" aria-label="Ειδικότητα"><option value="">Όλες οι ειδικότητες</option>${S.roles.map(r=>`<option value="${r.id}" ${UI.payRole===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
    <div class="bar"><button class="btn sm" data-act="copypay">Αντιγραφή λίστας</button>${st.open?`<button class="btn sm ${UI.arm==='payall'?'arm':'pri'}" data-act="payall">${UI.arm==='payall'?'Πάτα ξανά: πληρώθηκαν όλοι':'Πληρώθηκαν όλοι'}</button>`:''}</div></div>
  <div class="tw desk"><table><thead><tr><th>Όνομα</th><th>Ειδικότητα</th><th class="n">Μεροκάματα</th><th class="n">Ώρες</th><th class="n">Υπερωρίες</th><th class="n">Κρατήσεις</th><th class="n">Ποσό</th><th></th></tr></thead><tbody>`;
  if(!rows.length)h+=`<tr><td colspan="8" class="empty">Δεν υπάρχουν βάρδιες σε αυτή την εβδομάδα.</td></tr>`;
  rows.forEach(r=>{const pp=P[r.p.id];const diff=pp&&Math.abs(pp.amount-r.total)>0.009;
    h+=`<tr><td style="white-space:nowrap"><b>${esc(r.p.name)}</b>${r.no?` <span class="pill bad">${r.no} απουσία</span>`:''}</td><td class="sub">${esc(roleOf(S,r.p.role).one)}</td><td class="n">${r.n}</td><td class="n">${hh(r.h)}</td><td class="n">${r.otc?'+'+eur(r.otc):'—'}</td><td class="n">${r.cutc?'−'+eur(r.cutc):'—'}</td><td class="n"><b>${eur(r.total)}</b>${diff?`<br><span class="sub">πληρώθηκε ${eur(pp.amount)}</span>`:''}</td>
    <td class="n">${pp?`<button class="btn sm paybtn" data-act="unpay" data-p="${r.p.id}" title="Αναίρεση"><span class="paid">Πληρώθηκε ${dm(pp.date)}</span></button>`:`<button class="btn sm pri paybtn" data-act="pay1" data-p="${r.p.id}">Πληρωμή</button>`}</td></tr>`});
  h+=`</tbody></table></div><div class="mob">${rows.length?'':'<div class="empty">Δεν υπάρχουν βάρδιες σε αυτή την εβδομάδα.</div>'}${rows.map(r=>{const pp=P[r.p.id];const ex=[r.otc?'+'+eur(r.otc)+' υπερωρίες':'',r.cutc?'−'+eur(r.cutc)+' κρατήσεις':''].filter(Boolean).join(' · ');
    return `<div class="prow"><div><b>${esc(r.p.name)}</b>${r.no?` <span class="pill bad">${r.no} απουσία</span>`:''}<span class="sub">${esc(roleOf(S,r.p.role).one)} · ${r.n} ${r.n===1?'βάρδια':'βάρδιες'} · ${hh(r.h)}</span>${ex?`<span class="sub">${ex}</span>`:''}</div>
    <div class="pa"><b class="num">${eur(r.total)}</b>${pp?`<button class="btn sm" data-act="unpay" data-p="${r.p.id}" title="Αναίρεση"><span class="paid">Πληρώθηκε ${dm(pp.date)}</span></button>`:`<button class="btn sm pri" data-act="pay1" data-p="${r.p.id}">Πληρωμή</button>`}</div></div>`}).join('')}</div></section>`;
  return h;
}

    <div class="tw desk"><table><thead><tr><th>Όνομα</th><th>Μέρες</th><th class="n">Μεροκάματο</th><th class="n">Υπερωρία/ώρα</th><th class="n">Κράτηση/ώρα</th><th></th></tr></thead><tbody>`;
    S.roles.forEach(r=>{const ps=S.staff.filter(p=>p.role===r.id);if(!ps.length)return;h+=`<tr class="grp" data-gh="${r.id}"><td colspan="6">${esc(r.name)}</td></tr>`;
      ps.forEach(p=>{const pr=payOf(S,p);h+=`<tr data-g="${r.id}" data-q="${esc(norm(p.name))}" ${hid(p)} style="${p.active?'':'opacity:.5'}"><td style="white-space:nowrap"><b>${esc(p.name)}</b>${p.lead?' <span class="pill">υπεύθυνος</span>':''}${p.active?'':' <span class="pill warn">ανενεργός</span>'}</td><td class="sub">${daysLbl(p)}</td><td class="n"><b>${eur(pr.wage)}</b></td><td class="n">${eur(pr.ot)}</td><td class="n">${eur(pr.cut)}</td><td class="n"><button class="btn sm" data-act="editstaff" data-id="${p.id}">Επεξεργασία</button></td></tr>`})});
    h+=`</tbody></table></div><div class="mob">`;
    S.roles.forEach(r=>{const ps=S.staff.filter(p=>p.role===r.id);if(!ps.length)return;h+=`<div class="sgrp" data-gh="${r.id}">${esc(r.name)}</div>`;
      ps.forEach(p=>{const pr=payOf(S,p);h+=`<button class="srow" data-act="editstaff" data-id="${p.id}" data-g="${r.id}" data-q="${esc(norm(p.name))}" ${hid(p)} style="${p.active?'':'opacity:.55'}"><span><b>${esc(p.name)}</b>${p.lead?' <span class="pill">υπεύθυνος</span>':''}${p.active?'':' <span class="pill warn">ανενεργός</span>'}<span class="sub">${daysLbl(p)} · μεροκάματο ${eur(pr.wage)}</span></span><span class="chev" aria-hidden="true">›</span></button>`})});
    h+=`</div></section>`}
  if(UI.setTab==='data')h+=`<section class="card stack"><div>Τα δεδομένα αυτής της έκδοσης μένουν μόνο σε αυτόν τον browser. Το κατάστημα και τα ονόματα είναι ενδεικτικά.</div>

  return h;
}

function sheet(html){$('#layer').innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#layer select,#layer input');if(f&&!matchMedia('(pointer:coarse)').matches)f.focus()}
function closeSheet(){$('#layer').innerHTML=''}
function weekCount(ws,pid){let n=0;for(let i=0;i<7;i++)if((S.sched[addD(ws,i)]||[]).some(e=>e.p===pid))n++;return n}
function addSheet(d,sid,rid,extra){
  const sh=shiftOf(S,sid),r=roleOf(S,rid),day=S.sched[d]||[],busy=new Set(day.map(e=>e.p)),ws=schedStart(d);

  <div class="form"><label class="f">Από<input id="m_a" type="time" value="${sh.a}"></label><label class="f">Έως<input id="m_b" type="time" value="${sh.b}"></label></div>${S.zones.length?`<label class="f">Χώρος<select id="m_z"><option value="">Χωρίς χώρο</option>${S.zones.map(z=>`<option ${""===z?'selected':''}>${esc(z)}</option>`).join('')}</select></label>`:''}`:'<div class="empty">Δεν υπάρχει ελεύθερο άτομο γι\' αυτή τη μέρα.</div>'}

}

  ${(()=>{const o=shiftsOn(S,d).filter(x=>x.id!==e.s&&forRole(x,p.role));return o.length?`<label class="f">Παράταση για να καλύψει και τη βάρδια<select id="m_cov"><option value="">Όχι</option>${o.map(x=>`<option value="${x.id}" ${e.cov===x.id?'selected':''}>${esc(x.name)} ${x.a}–${x.b}</option>`).join('')}</select></label><div class="hint" style="margin-top:-8px">Οι ώρες αλλάζουν μόνες τους. Πληρώνεται με βάση τις συνολικές ώρες: υπερωρία ή αυξημένο μεροκάματο μεγάλης βάρδιας.</div>`:''})()}
  <div class="acts"><button class="btn danger" data-act="delentry" data-d="${d}" data-id="${id}" style="margin-right:auto">Αφαίρεση</button><button class="btn" data-act="close">Άκυρο</button><button class="btn pri" data-act="saveedit" data-d="${d}" data-id="${id}">Αποθήκευση</button></div>`);

/* ---------- Θέσεις που λείπουν ---------- */
function gapsOf(S,ws){const out=[];const all=addD(ws,6)<TODAY;
  for(let i=0;i<7;i++){const d=addD(ws,i);if(!all&&d<TODAY)continue;const day=S.sched[d]||[];
    shiftsOn(S,d).forEach(sh=>S.roles.forEach(r=>{const n=needOf(S,d,sh.id,r.id)-day.filter(e=>inSh(e,sh.id)&&staffOf(S,e.p).role===r.id).length;if(n>0)out.push({d,sh,r,n})}))}
  return out}
// Παράταση: η βάρδια του ατόμου απλώνεται ώστε να πιάνει και την άλλη βάρδια.
function spanOf(e,sh){const nm=t=>{const m=mins(t);return m<360?m+1440:m};const s1=nm(e.a),l1=hoursBetween(e.a,e.b)*60,s2=nm(sh.a);const l2=hoursBetween(sh.a,sh.b)*60;
  const a=Math.min(s1,s2),b=Math.max(s1+l1,s2+l2);const f=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+':'+pad(((m%60)+60)%60);return{a:f(a),b:f(b),extra:(b-a-l1)/60}}
function gapSheet(ws){const g=gapsOf(S,ws);
  if(!g.length){sheet(`<h2>Δεν λείπει καμία θέση</h2><div class="sub">Όλες οι βάρδιες ${swLabel(ws)} έχουν τα άτομα που χρειάζονται.</div><div class="acts"><button class="btn pri" data-act="close">Κλείσιμο</button></div>`);return}
  const tot=g.reduce((a,x)=>a+x.n,0);
  sheet(`<h2>${tot===1?'Λείπει 1 θέση':'Λείπουν '+tot+' θέσεις'}</h2><div class="sub">Για κάθε θέση: βάλε άλλο άτομο ή δώσε παράταση ωραρίου σε κάποιον που δουλεύει ήδη εκείνη τη μέρα. Η παράταση πληρώνεται ως υπερωρία.</div>
  <div class="stack" style="gap:0">${g.map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${DF[dow(x.d)]} ${dm(x.d)}</b> · ${esc(x.sh.name)} <span class="sub">${x.sh.a}–${x.sh.b}</span>
    <div style="margin:3px 0 8px"><span class="pill bad">${esc(x.r.name)}: ${x.n===1?'λείπει 1':'λείπουν '+x.n}</span>${(S.dayNotes||{})[x.d]?` <span class="pill warn">${esc(S.dayNotes[x.d])}</span>`:''}</div>
    ${x.d>=TODAY?`<div class="bar"><button class="btn sm" data-act="add" data-g="1" data-d="${x.d}" data-s="${x.sh.id}" data-r="${x.r.id}">+ Βάλε άτομο</button><button class="btn sm" data-act="cover" data-g="1" data-d="${x.d}" data-s="${x.sh.id}" data-r="${x.r.id}">Παράταση ωραρίου</button><button class="btn sm" data-act="gapgo" data-d="${x.d}">Άνοιγμα μέρας</button></div>`:'<span class="sub">Η μέρα πέρασε.</span>'}</div>`).join('')}</div>
  <div class="acts"><button class="btn pri" data-act="close">Κλείσιμο</button></div>`)}
function coverSheet(d,sid,rid){const sh=shiftOf(S,sid),r=roleOf(S,rid),day=S.sched[d]||[];
  const c=day.filter(e=>!inSh(e,sid)&&!e.cov&&staffOf(S,e.p).role===rid).map(e=>({e,p:staffOf(S,e.p),sp:spanOf(e,sh)})).filter(x=>x.sp.extra>0).sort((a,b)=>a.sp.extra-b.sp.extra);
  sheet(`<h2>Παράταση ωραρίου</h2><div class="sub">${DF[dow(d)]} ${dm(d)} · ${esc(sh.name)} ${sh.a}–${sh.b} · ${esc(r.name)}. Διάλεξε ποιος μένει παραπάνω (ή έρχεται νωρίτερα) για να καλύψει τη θέση. Τις ακριβείς ώρες τις αλλάζεις μετά πατώντας το όνομά του.</div>
  ${c.length?`<div class="stack" style="gap:0">${c.map(x=>{const q=blockOf(S,x.p.id,d,x.sp.a,x.sp.b);return `<div class="prow"><div><b>${esc(x.p.name)}</b><span class="sub">${esc(shiftOf(S,x.e.s).name)} ${x.e.a}–${x.e.b} → <b>${x.sp.a}–${x.sp.b}</b> (${hh(hoursBetween(x.sp.a,x.sp.b))})</span><span class="sub" style="color:var(--warn)">+${hh(x.sp.extra)} · +${eur(payCalc(S,x.p,hoursBetween(x.sp.a,x.sp.b),hoursBetween(x.sp.a,x.sp.b)).cost-payCalc(S,x.p,hoursBetween(x.e.a,x.e.b),hoursBetween(x.e.a,x.e.b)).cost)}</span>${q?`<span class="sub" style="color:var(--bad)">${esc(reqText(q))}</span>`:''}</div><div class="pa"><button class="btn sm pri" data-act="docover" data-d="${d}" data-id="${x.e.id}" data-s="${sid}" data-g="${UI.fromGaps?1:''}">Επιλογή</button></div></div>`}).join('')}</div>`:`<div class="empty">Κανείς από ${esc(r.name.toLowerCase())} δεν δουλεύει άλλη βάρδια εκείνη τη μέρα. Δοκίμασε «Βάλε άτομο».</div>`}
  <div class="acts"><button class="btn" data-act="close">Άκυρο</button></div>`)}
function afterGapFix(){if(UI.fromGaps){UI.fromGaps=false;if(gapsOf(S,UI.ws).length)gapSheet(UI.ws);else toast('Καλύφθηκαν όλες οι θέσεις')}}

/* ---------- Ενέργειες ---------- */
function payText(ws){const P=S.paid[ws]||{};const rows=weekPay(S,ws).filter(r=>r.total>0);
  return S.set.name+'\nΠληρωμές εβδομάδας '+wkLabel(ws)+' ('+DF[dow(payDate(S,ws))]+' '+dm(payDate(S,ws))+')\n\n'+
  rows.map(r=>r.p.name+' · '+r.n+' βάρδιες · '+eur(r.total)+(P[r.p.id]?' · πληρώθηκε':'')).join('\n')+'\n\nΣύνολο: '+eur(rows.reduce((a,r)=>a+r.total,0))}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,D=b.dataset;
  if(a==='close'){if(ev.target===b||b.tagName==='BUTTON')closeSheet();return}
  const armed=UI.arm;if(!['clear','payall','reset','delshift'].includes(a))UI.arm=null;
  switch(a){
  case'go':UI.page=D.id;UI.arm=null;window.scrollTo(0,0);break;
  case'wk':UI.ws=addD(UI.ws,7*D.n);break;
  case'gonext':UI.ws=addD(schedStart(TODAY),7);UI.view='day';break;
  case'fixcf':{const cf=conflicts(S,UI.ws);cf.forEach(x=>{S.sched[x.d]=S.sched[x.d].filter(e=>e!==x.e)});const r=autoWeek(S,UI.ws);S.userEdited=true;save();toast(`Βγήκαν ${cf.length}, μπήκαν ${r.added} αντικαταστάτες`+(r.short?`, λείπουν ${r.short}`:''));break}
  case'addreq':reqSheet(null);return;
  case'editreq':reqSheet(D.id);return;
  case'savereq':{const g=id=>$('#'+id);const k=g('q_k').value;const q=D.id?S.reqs.find(x=>x.id===D.id):{id:nid('q')};
    const all=k==='leave'||g('q_all').value==='1';
    Object.assign(q,{p:g('q_p').value,k,all,note:g('q_note').value.trim()});
    if(k==='week'){q.wd=+g('q_wd').value;delete q.from;delete q.to}else{q.from=g('q_from').value;q.to=k==='leave'?(g('q_to').value||q.from):q.from;if(q.to<q.from)q.to=q.from}
    if(!all){q.a=g('q_a').value;q.b=g('q_b').value}else{delete q.a;delete q.b}
    if(!D.id)S.reqs.push(q);closeSheet();commit();toast('Το αίτημα καταχωρήθηκε');return}
  case'delreq':S.reqs=S.reqs.filter(x=>x.id!==D.id);closeSheet();commit();return;
  case'view':UI.view=D.v;break;
  case'day':UI.day=D.d;break;
  case'auto':{const r=autoWeek(S,UI.ws);S.userEdited=true;save();toast(r.added||r.removed?refitMsg(r):r.short?`Δεν βρέθηκαν διαθέσιμα άτομα για ${r.short} θέσεις`:'Το πρόγραμμα είναι ήδη όπως πρέπει');if(r.short&&gapsOf(S,UI.ws).length){render();gapSheet(UI.ws);return};break}
  case'clear':if(armed!=='clear'){UI.arm='clear';break}UI.arm=null;for(let i=0;i<7;i++){const d=addD(UI.ws,i);if(d>=TODAY)S.sched[d]=[]}S.userEdited=true;save();toast('Καθαρίστηκαν οι μέρες από σήμερα και μετά');break;
  case'add':UI.fromGaps=!!D.g;addSheet(D.d,D.s,D.r,false);return;
  case'gaps':gapSheet(UI.ws);return;
  case'gapgo':closeSheet();UI.day=D.d;UI.view='day';UI.shF='';break;
  case'cover':UI.fromGaps=!!D.g;coverSheet(D.d,D.s,D.r);return;
  case'docover':{const e=(S.sched[D.d]||[]).find(x=>x.id===D.id);const sp=spanOf(e,shiftOf(S,D.s));Object.assign(e,{a:sp.a,b:sp.b,cov:D.s});UI.fromGaps=!!D.g;closeSheet();commit();toast(`${staffOf(S,e.p).name}: ${sp.a}–${sp.b}, +${hh(sp.extra)} υπερωρία`);afterGapFix();return}
  case'extra':addSheet(D.d,D.s,'',true);return;
  case'saveadd':{const p=$('#m_p').value,aa=$('#m_a').value,bb=$('#m_b').value;const e={id:nid('e'),p,s:D.s,a:aa,b:bb};if(D.x)e.x=1;if($('#m_z')&&$('#m_z').value)e.z=$('#m_z').value;(S.sched[D.d]=S.sched[D.d]||[]).push(e);UI.afterAdd=UI.fromGaps;
    if(D.x){(S.att[D.d]=S.att[D.d]||{})[e.id]={st:'yes',a:aa,b:bb}}closeSheet();commit();afterGapFix();return}
  case'edit':editSheet(D.d,D.id);return;
  case'saveedit':{const e=S.sched[D.d].find(x=>x.id===D.id);const ns=$('#m_s').value,moved=e.s!==ns,old=e.cov||'',cv=$('#m_cov')?$('#m_cov').value:'';e.s=ns;e.a=$('#m_a').value;e.b=$('#m_b').value;const o=shiftOf(S,e.s);
    if(moved){e.a=o.a;e.b=o.b}
    if(cv&&cv!==e.s&&(moved||cv!==old)){const sp=spanOf({a:o.a,b:o.b},shiftOf(S,cv));Object.assign(e,{a:sp.a,b:sp.b,cov:cv})}
    else if(!cv||cv===e.s){if(old&&!moved){e.a=o.a;e.b=o.b}delete e.cov}if($('#m_z')){if($('#m_z').value)e.z=$('#m_z').value;else delete e.z}closeSheet();commit();return}
  case'delentry':S.sched[D.d]=S.sched[D.d].filter(x=>x.id!==D.id);if(S.att[D.d])delete S.att[D.d][D.id];closeSheet();commit();return;
  case'cyc':{const day=S.sched[D.d]=S.sched[D.d]||[];const i=day.findIndex(e=>e.p===D.p);
    const rid=staffOf(S,D.p).role;const L=shiftsOn(S,D.d).filter(sh=>dayShiftOf(S,D.d,sh.id)?(sh.need||{})[rid]>0:forRole(sh,rid));if(!L.length)break;
    if(i<0){const sh=L[0];day.push({id:nid('e'),p:D.p,s:sh.id,a:sh.a,b:sh.b})}
    else{const k=L.findIndex(s=>s.id===day[i].s);if(k<L.length-1){const sh=L[k+1];Object.assign(day[i],{s:sh.id,a:sh.a,b:sh.b})}else{if(S.att[D.d])delete S.att[D.d][day[i].id];day.splice(i,1)}}
    S.userEdited=true;save();break}
  case'attd':UI.attD=addD(UI.attD,+D.n);break;
  case'atttoday':UI.attD=TODAY;break;
  case'st':{const A=S.att[D.d]=S.att[D.d]||{};const e=S.sched[D.d].find(x=>x.id===D.id);
    if(A[D.id]&&A[D.id].st===D.v)delete A[D.id];else A[D.id]=D.v==='yes'?{st:'yes',a:(A[D.id]&&A[D.id].a)||e.a,b:(A[D.id]&&A[D.id].b)||e.b}:{st:'no'};S.userEdited=true;save();break}
  case'allin':{const A=S.att[D.d]=S.att[D.d]||{};let n=0;(S.sched[D.d]||[]).filter(e=>e.s===D.s).forEach(e=>{if(!A[e.id]){A[e.id]={st:'yes',a:e.a,b:e.b};n++}});S.userEdited=true;save();toast(n?`Σημειώθηκαν ${n} παρουσίες`:'Όλοι είχαν ήδη σημειωθεί');break}
  case'cmode':UI.costMode=D.v;break;
  case'costd':UI.costD=addD(UI.costD,+D.n);break;
  case'costw':UI.costWs=addD(UI.costWs,7*D.n);break;
  case'payws':UI.payWs=D.w;break;
  case'pay1':{const r=weekPay(S,UI.payWs).find(x=>x.p.id===D.p);S.paid[UI.payWs][D.p]={amount:r.total,date:TODAY};S.userEdited=true;save();break}
  case'unpay':delete S.paid[UI.payWs][D.p];S.userEdited=true;save();break;
  case'payall':if(armed!=='payall'){UI.arm='payall';break}UI.arm=null;{const P=S.paid[UI.payWs];weekPay(S,UI.payWs).forEach(r=>{if(r.total>0&&!P[r.p.id]&&(!UI.payRole||r.p.role===UI.payRole))P[r.p.id]={amount:r.total,date:TODAY}})}S.userEdited=true;save();toast('Σημειώθηκαν ως πληρωμένοι');break;
  case'copypay':{const t=payText(UI.payWs);const ok=()=>toast('Η λίστα αντιγράφηκε');try{navigator.clipboard.writeText(t).then(ok,()=>showText(t,'Λίστα πληρωμών'))}catch(e){showText(t,'Λίστα πληρωμών')}return}
  case'stab':UI.setTab=D.v;break;
  case'nday':UI.needDay=+D.v;break;
  case'ncopy':{const src=JSON.stringify(S.needs[UI.needDay||0]||{});D.v.split('').forEach(i=>{S.needs[i]=JSON.parse(src)});{const m=refitMsg(refit(S,d=>D.v.includes(String(dow(d)))));toast('Αντιγράφηκε'+(m?'. '+m:''))}S.userEdited=true;save();break}
  case'shday':{const sh=S.shifts.find(x=>x.id===D.id);let ds=sh.days?sh.days.slice():[0,1,2,3,4,5,6];const i=+D.v;ds=ds.includes(i)?ds.filter(x=>x!==i):ds.concat(i).sort();if(!ds.length){toast('Η βάρδια πρέπει να τρέχει τουλάχιστον μία μέρα');return}sh.days=ds.length===7?undefined:ds;commit();return}
  case'shrole':{const sh=S.shifts.find(x=>x.id===D.id);if(!D.v)delete sh.roles;else{let rs=sh.roles?sh.roles.slice():[];rs=rs.includes(D.v)?rs.filter(x=>x!==D.v):rs.concat(D.v);if(rs.length&&rs.length<S.roles.length)sh.roles=rs;else delete sh.roles}commit();return}
  case'dneed':{const N=S.dayNeeds[D.d]=S.dayNeeds[D.d]||{};const M=N[D.s]=N[D.s]||{};const v=Math.max(0,needOf(S,D.d,D.s,D.r)+(+D.v));if(v===baseNeed(S,D.d,D.s,D.r))delete M[D.r];else M[D.r]=v;if(!Object.keys(M).length)delete N[D.s];if(!Object.keys(N).length)delete S.dayNeeds[D.d];if(D.d>=TODAY){const r=autoWeek(S,schedStart(D.d),[D.d]);const m=refitMsg(r);if(m)toast(m)}S.userEdited=true;save();break}
  case'dneedreset':delete S.dayNeeds[D.d];if(D.d>=TODAY&&(S.sched[D.d]||[]).length){const m=refitMsg(autoWeek(S,schedStart(D.d),[D.d]));if(m)toast(m)}S.userEdited=true;save();break;
  case'showall':UI.showAll=!UI.showAll;break;
  case'shf':UI.shF=D.v;break;
  case'attsh':UI.attShift=D.v;break;
  case'atttodo':UI.attTodo=!UI.attTodo;break;
  case'nstep':{const di=UI.needDay||0;const N=S.needs[di]=S.needs[di]||{};const M=N[D.s]=N[D.s]||{};M[D.id]=Math.max(0,Math.min(50,(M[D.id]||0)+(+D.v)));{const m=refitMsg(refit(S,d=>dow(d)===di));if(m)toast(m)}S.userEdited=true;save();break}
  case'copyroster':S.pub=S.pub||{};S.pub[D.w]=TODAY;save();copyText(rosterText(D.w,UI.shRole||''),'Το πρόγραμμα αντιγράφηκε. Επικόλλησέ το στην ομάδα Viber ή WhatsApp.');break;
  case'persmsgs':persSheet(UI.ws);return;
  case'copyp':copyText(personText(D.w,staffOf(S,D.p)),'Αντιγράφηκε για '+staffOf(S,D.p).name);return;
  case'exshift':exSheet(D.d,D.id);return;
  case'saveex':{const g=id=>$('#'+id);const L=S.dayShifts[D.d]=S.dayShifts[D.d]||[];let x=D.id?L.find(y=>y.id===D.id):null;if(!x){x={id:nid('s')};L.push(x)}
    x.name=g('x_name').value.trim()||'Έκτακτη βάρδια';x.a=g('x_a').value;x.b=g('x_b').value;x.need={};S.roles.forEach(r=>{const n=+g('x_r_'+r.id).value||0;if(n>0)x.need[r.id]=n});
    (S.sched[D.d]||[]).forEach(e=>{if(e.s===x.id){e.a=x.a;e.b=x.b}});closeSheet();const r=D.d>=TODAY?autoWeek(S,schedStart(D.d),[D.d]):{};commit();toast('Η βάρδια αποθηκεύτηκε'+(refitMsg(r)?'. '+refitMsg(r):''));return}
  case'delex':{S.dayShifts[D.d]=(S.dayShifts[D.d]||[]).filter(y=>y.id!==D.id);if(S.sched[D.d])S.sched[D.d]=S.sched[D.d].filter(e=>e.s!==D.id);closeSheet();commit();return}
  case'addshift':S.shifts.push({id:nid('s'),name:'Νέα βάρδια',a:'09:00',b:'15:00'});commit();return;
  case'delshift':if(armed!=='dsh'+D.id){UI.arm='dsh'+D.id;break}UI.arm=null;S.shifts=S.shifts.filter(s=>s.id!==D.id);commit();return;
  case'addrole':{const id=nid('r');S.roles.push({id,name:'Νέα ειδικότητα',one:'Νέα ειδικότητα',wage:50,ot:7,cut:5.5,bh:9,lon:false,lh:12,lx:1.5});commit();return}
  case'sfday':b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'));return;
  case'addstaff':staffSheet(null);return;
  case'editstaff':staffSheet(D.id);return;
  case'savestaff':{const g=id=>$('#'+id);const name=g('f_name').value.trim();if(!name){g('f_name').focus();toast('Γράψε όνομα');return}
    const num=id=>Math.max(0,+String(g(id).value).replace(',','.')||0);
    let p=D.id?S.staff.find(x=>x.id===D.id):null;if(!p){p={id:nid('p'),active:true};S.staff.push(p)}
    Object.assign(p,{name,role:g('f_role').value,phone:g('f_phone').value.trim(),wage:num('f_wage'),ot:num('f_ot'),cut:num('f_cut'),lead:g('f_lead').checked});
    {const on=[...document.querySelectorAll('#f_days button')].map((b,i)=>b.classList.contains('on')?i:-1).filter(i=>i>=0);if(!on.length){toast('Διάλεξε τουλάχιστον μία μέρα');return}if(on.length===7){delete p.days;p.off=-1}else{p.days=on;p.off=-1}}
    if(g('f_active'))p.active=g('f_active').checked;
    // βγαίνει από τις μελλοντικές μέρες που πλέον δεν δουλεύει και οι θέσεις ξαναγεμίζουν
    {const gone=[];Object.keys(S.sched).forEach(d=>{if(d<TODAY)return;const A=S.att[d]||{};const L=S.sched[d];for(let i=L.length-1;i>=0;i--){const e=L[i];if(e.p===p.id&&!A[e.id]&&(!worksOn(p,d)||!p.active)){L.splice(i,1);gone.push(d)}}});
     const r=refit(S,d=>gone.includes(d));if(gone.length){const m=refitMsg(r);toast((D.id?'Αποθηκεύτηκε':'Ο υπάλληλος προστέθηκε')+'. Βγήκε από '+gone.length+(gone.length===1?' βάρδια':' βάρδιες')+(m?'. '+m.replace('Το πρόγραμμα άλλαξε: ',''):''));closeSheet();commit();return}}
    closeSheet();commit();toast(D.id?'Αποθηκεύτηκε':'Ο υπάλληλος προστέθηκε');return}
  case'reset':if(armed!=='reset'){UI.arm='reset';break}UI.arm=null;PUB=0;S=demo();save();toast('Τα δεδομένα επίδειξης επανήλθαν');break;
  }
  render();
});
// Αναζήτηση στο προσωπικό χωρίς να ξαναζωγραφίζεται η σελίδα (κρατάει το πληκτρολόγιο ανοιχτό)
document.addEventListener('input',ev=>{if(ev.target.id!=='staffq')return;UI.staffQ=ev.target.value;const q=norm(ev.target.value.trim());
  document.querySelectorAll('#main [data-q]').forEach(el=>{el.hidden=!!q&&!el.dataset.q.includes(q)});
  document.querySelectorAll('#main [data-gh]').forEach(g=>{g.hidden=![...g.parentElement.querySelectorAll(`[data-g="${g.dataset.gh}"]`)].some(x=>!x.hidden)})});
function showText(t,title){sheet(`<h2>${esc(title||"Κείμενο για αντιγραφή")}</h2><textarea class="inp" id="m_txt" rows="12" style="width:100%;font-size:13px">${esc(t)}</textarea><div class="acts"><button class="btn pri" data-act="close">Κλείσιμο</button></div>`);const x=$('#m_txt');x.focus();x.select()}
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='q_k'||el.id==='q_all'){reqFields();return}
  if(el.id==='f_role'){const r=roleOf(S,el.value);['wage','ot','cut'].forEach(k=>{$('#f_'+k).value=r[k]});return}const k=el.dataset.ch;if(!k)return;const D=el.dataset;const v=el.type==='checkbox'?el.checked:el.value;
  switch(k){
  case'lead':if(v)S.lead[D.k]=v;else delete S.lead[D.k];break;
  case'dnote':if(v.trim())S.dayNotes[D.d]=v.trim();else delete S.dayNotes[D.d];break;
  case'ta':case'tb':{const A=S.att[D.d]=S.att[D.d]||{};const e=(S.sched[D.d]||[]).find(x=>x.id===D.id);if(!e||!v)break;const at=A[D.id]=A[D.id]&&A[D.id].st==='yes'?A[D.id]:{st:'yes',a:e.a,b:e.b};at[k==='ta'?'a':'b']=v;break}
  case'payrole':UI.payRole=v;render();return;
  case'shrole':UI.shRole=v;render();return;
  case'set':S.set[D.k]=D.k==='name'?v:+v;if(D.k==='pubDay'){PUB=+v;UI.ws=schedStart(TODAY)}break;
  case'setv':S.set[D.k]=v;break;
  case'zones':S.zones=v.split(',').map(x=>x.trim()).filter(Boolean);break;
  case'shift':{const s=S.shifts.find(x=>x.id===D.id);s[D.k]=v;break}
  case'role':{const r=S.roles.find(x=>x.id===D.id);if(['wage','ot','cut','bh','lh','lx'].includes(D.k))r[D.k]=Math.max(0,+v||0);else if(D.k==='lon')r.lon=!!v;else{r[D.k]=v;if(D.k==='name')r.one=v}break}
  case'need':{const di=UI.needDay||0;const N=S.needs[di]=S.needs[di]||{};(N[D.s]=N[D.s]||{})[D.id]=Math.max(0,+v||0);const m=refitMsg(refit(S,d=>dow(d)===di));if(m)toast(m);break}
  case'staff':{const p=S.staff.find(x=>x.id===D.id);if(['wage','ot','cut'].includes(D.k))p[D.k]=v===''?null:Math.max(0,+v||0);else if(D.k==='off')p.off=+v;else p[D.k]=v;break}
  }
  commit();
});
render();
})();
</script>
